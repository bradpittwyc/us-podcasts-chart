ke Duncan", "genre": "History", "rss": "https://rss.libsyn.com/shows/47475/destinations/159998.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts/v4/fc/90/04/fc9004c7-afd6-4b5e-5033-0fb3dfd6c3a3/mza_7623711418780898276.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/revolutions/view", "description_en": "Season 12 premiered October 20, 2024 – a nonfictional account of The Martian Revolution of 2247. Mike Duncan is taking everything he's learned from 12 seasons of historical revolutions - the repeating arcs, characters, ideas, events, and patterns which all revolutions seem to follow - and created a fictional history of the Martian Revolution of 2247. The series is written from the point of view of a historian working hundreds of years after the Martian Revolution and will be presented in the style and format of previous seasons of Revolutions. It will look, sound, and feel like a Mike Duncan history podcast…but will instead be a fictional narrative of a gripping science-fiction epic. Revolutions is a podcast that covers the great political revolutions that have defined the modern world. Each season is a long-form narrative covering a different defining revolutionary epoch across three hundred years of history. It explores in great detail the people, ideas, and events that challenged and toppled outdated regimes and replaced them with new governments. After more than 350 episodes over ten seasons of narrative nonfiction, the 12th season is a fictional account of the Martian Revolution of 2247. *BREAKING NEWS* In the fall of 2025, the Revolutions podcast will return to its roots by diving into the great revolutions of the 20th century. The new run of episodes begins with the story of Irish Independence, a dramatic upheaval in the wake of WWI that saw Ireland free itself from centuries of English rule. Full of inspiring personalities, tragic events, and thrilling triumphs, Irish Independence is one of the most gripping events in revolutionary history. Future seasons will plunge ahead through the turbulent 20th century, and include the Spanish Civil War, the Cuban Revolution, and the Algerian War of Independence.", "slug": "revolutions", "description_zh": "Mike Duncan 主持的历史类播客，逐集讲述世界史上的重大革命，从英国光荣革命到伊朗革命，叙事详尽。"}, {"rank": 30, "title": "Conspiracy Theories", "author": "Spotify Studios", "genre": "History", "rss": "", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/97/a6/ee/97a6eee7-f122-29f2-64ef-d3266c19fabd/mza_16933982100645847650.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/conspiracy-theories-1/view", "description_en": "暂无简介", "slug": "conspiracy-theories-1", "description_zh": "Spotify 出品的阴谋论类播客，每集解析一个流行阴谋论。"}], "Kids & Family": [{"rank": 1, "title": "Greeking Out from National Geographic Kids", "author": "National Geographic Kids | Realm", "genre": "Stories for Kids", "rss": "https://feeds.megaphone.fm/ESP4751925729", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/ed/59/8d/ed598d66-4ed7-172f-6bd5-3143f01bdeda/mza_2990023010383729301.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/greeking-out-from-national-geographic-kids/view", "description_en": "Oh, Muses! Hear our podcast and allow us to recall some of the greatest stories ever told. Stories of gods and goddesses, monsters, and heroes! Enjoy this kid-friendly retelling of classic ancient Greek myths for the whole family. ---- Parents, the Greeking Out books are out! Three of them! Available wherever you get your books. ⚡ Want more? Binge the full show, including new episodes, ad-free at&nbsp;pinna.fm. Use code GREEKINGOUT30 to receive a special discount!", "slug": "greeking-out-from-national-geographic-kids", "description_zh": "国家地理儿童版出品的希腊神话类播客，用有趣的方式讲述希腊神话故事，面向儿童听众。"}, {"rank": 2, "title": "Circle Round", "author": "WBUR", "genre": "Kids & Family", "rss": "https://rss.wbur.org/circleround/podcast", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/54/3 aced by teachers for its engaging content that seamlessly integrates into classroom learning. With a dynamic schedule of four new episodes each week, \"Who Smarted?\" offers a treasure trove of knowledge disguised as entertainment. This podcast takes learning to a whole new level by infusing it with humor, creativity, storytelling, interactivity and excitement. It's a journey through hilarious history, surprising science, fascinating trivia, mind-boggling facts, and captivating stories designed to spark curiosity and ignite a love for learning in young minds. Whether you're a parent looking for an educational yet entertaining podcast for your kids, or a teacher seeking fresh and engaging content for your classroom, \"Who Smarted?\" has got you covered. Each episode offers a unique adventure that is guaranteed to lead to meaningful discussions afterwards while leaving listeners craving more. Kids trivia becomes an exciting quest for knowledge, and every fact is a stepping stone on the path to discovery. With topics ranging from the wonders of the natural world to the mysteries of the universe, \"Who Smarted?\" ensures that learning is never boring but always a thrilling ride. Join the millions of families who have made \"Who Smarted?\" their favorite podcast for learning and laughter. With its free and easily accessible format, it's the perfect companion for car rides, family gatherings, bedtime, meal times, bath times, or just quiet afternoons at home. Transform screen time into quality time, and marvel as your child's imagination soars and their thirst for knowledge grows with each episode. In a world where educational resources abound, \"Who Smarted?\" stands out as one of the best podcasts for kids, offering a unique blend of entertainment and enlightenment. Don't miss out on this opportunity to turn learning into an adventure with \"Who Smarted?\" - the podcast that's smart, funny, and loved by all!", "slug": "who-smarted", "description_zh": "Atomic Audio 出品的儿童教 ters use facts and passion to make their case, teaching listeners how to defend their opinions along the way! Past debaters include Tim Platt, cast member of the comedy narrative play podcast Rude Tales of Magic, comedian and writer Jenny Yang, Minneapolis-based rapper NUR-D, comedian and creator of the Story Pirates Peter McNerney, Radio Ambulante’s Daniel Alarcón, journalist and host of Into It Sam Sanders, host of Terrible, Thanks for Asking Nora McInerney, food-writer Kenji Lopez-Alt and many, many more. To top it off, our State of Debate segment shows listeners how to identify logical fallacies in the wild. Ad hominem attacks and bandwagon fallacies, be gone! So if you’re looking to ignite a funny, feisty debate on your next roadtrip, or just want some amusing arguments for your kids to consider while they fall asleep… tune into Smash Boom Best, where we make debate – a blast! Sales and Distribution by Lemonada Media https://lemonadamedia.com/&nbsp;&nbsp;", "slug": "smash-boom-best", "description_zh": "Brains On Universe 出品的儿童辩论类播客，两个孩子辩论有趣的话题，风格活泼。"}, {"rank": 14, "title": "Little Sleepers, Big Dreamers", "author": "Derek Moran", "genre": "Stories for Kids", "rss": "https://feeds.redcircle.com/ad05443e-d9ec-4a33-aa6d-c3b96c12ef05", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/b1/ac/d1/b1acd1a1-e7bc-665b-f90a-395f60db14a3/mza_17542111907302288840.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/little-sleepers-big-dreamers/view", "description_en": "A bedtime podcast for Kids and Families, inviting them to enter a world of wonder, calm and confidence. Each episode combines heartwarming bedtime stories with gentle affirmations, creating an ideal wind-down ritual for young minds and big imaginations.From magical adventures to reassuring words of encouragement, this podcast helps children drift off feeling safe, loved and ready to dream big. With soothing sounds and inspiring tales, Little Sleepers, Big Dreamers offers more than "}, {"rank": 16, "title": "Little Stories for Tiny People: Anytime and bedtime stories for kids", "author": "Rhea Pechter", "genre": "Stories for Kids", "rss": "https://www.littlestoriestinypeople.com/podcast.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/bd/09/9d/bd099dc4-9a2f-d7a6-d9df-e73f31653e98/mza_15181760892255234003.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/little-stories-for-tiny-people-anytime-and-bedtime-stories-for-kids/view", "description_en": "Little Stories for Tiny People features original stories the whole family will love. Filled with endearing characters and inventive story lines, LSFTP is sure to spark your child’s imagination and to delight the entire family. Lovingly crafted to appeal to all ages, LSFTP is perfect for car rides, bedtime, or any time! Little Stories Premium offers even more stories, an ad-free listening experience, and access to Little Stories for Sleep, an exclusive bedtime podcast. Visit www.littlestoriespremium.com to learn more.", "slug": "little-stories-for-tiny-people-anytime-and-bedtime-stories-for-kids", "description_zh": "Rhea Pechter 主持的儿童故事播客，专为低龄儿童创作的原创睡前故事。"}, {"rank": 17, "title": "Always Here", "author": "Abby Howard and Abby Howard | Daylight Media", "genre": "Parenting", "rss": "https://feeds.megaphone.fm/QCD9532749215", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/65/ba/77/65ba777f-f546-4d08-f05b-26426f9a2594/mza_16777187145981639903.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/always-here/view", "description_en": "Always Here is a podcast aimed to share the real, uplifting, and funny relationship moments between sister-in-laws Abby Howard & (you guessed it), Abby Howard. Always Here to share the hope and the hard with heart and humor.", "slug": "always-here", "description_zh": "Abby Howard 主持的儿童类播客，由 Daylight Media 出品。"}, {"rank": 18, "title": "Curious Kids Every Day: A Daily Educational Podcast", "author": "Curious Kids Every Day", "genre": "Education for Kids", "rss": "https://feeds.megaphone.fm/STM2682689129", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/91/11/86/911186ab-bf11-808f-ff09-48cf36f94516/mza_8298960451990972871.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/curious-kids-every-day-a-daily-educational-podcast/view", "description_en": "We answer a curious question every single day! Do you have a curious kid who asks you a million questions every day? Curious Kids Every Day is an intentionally slow paced and interactive daily podcast for kids AND their parents! My goal is to make learning fun for the whole family. My name is Josh. I am a dad of 4 who loves to learn and teach. I am grateful for all of the families who make Curious Kids Every Day a part of their daily routine. I have noticed that most children's shows these days (even the educational ones) are so loud, fast, and dumbed down. I guess they've always been that way to a degree, but it is definitely worse now than when I was a kid. This show is meant to reclaim a little bit of the sincerity and intentionality of the best of children's programming. Specifically, I am inspired by Mister Rogers' Neighborhood and Blue's Clues. I like how those shows are slow paced, how they talk directly to the kids, and how they respect the listener's intelligence. I intend for Curious Kids Every Day to do the same thing. Basically, I am making the kind of show that I want my kids to enjoy. Give this show a shot and watch how engaged your kid gets! I was amazed the first time that I played it for my kids. Audio has a unique ability to capture the imagination in a way that screens just cannot. Thank you for taking the time to read this, and I hope that your family enjoys Curious Kids Every Day! For more information about the show, along with a free printable with activity ideas that don't involve screens: https://curiouskidseveryday.com For activity sheets for every new episode of the show, go to: https://supportcuriouskids.com", "slug": "curious-kids-every-day-a-daily-educational-podcast", "description_zh": "每日更新的儿童教育类播客，每天一个知识小科普。"}, {"rank": 19, "title": "But Why: A Podcast for Curious Kids", "author": "Vermont Public", "genre": "Kids & Family", "rss": "https://podcasts.vpr.net/but-why", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts112/v4/ad/e9/90/ade9900f-7bff-100b-c444-0687ac7f28ea/mza_4228241252633750087.png/600x600bb.jpg", "podfollow_url": "https://podfollow.com/but-why-a-podcast-for-curious-kids/view", "description_en": "But Why is a show led by kids. They ask the questions and we find the answers. It’s a big interesting world out there. On But Why, we tackle topics large and small, about nature, words, even the end of the world. Know a kid with a question? Record it with a smartphone. Be sure to include your kid's first name, age, and town and send the recording to questions@butwhykids.org!", "slug": "but-why-a-podcast-for-curious-kids", "description_zh": "Vermont Public 出品的儿童科普类播客，回答孩子提出的问题。"}, {"rank": 20, "title": "Previa Alliance Podcast", "author": "Previa Alliance Team", "genre": "Parenting", "rss": "https://rss.buzzsprout.com/2002513.rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/36/c8/ca/36c8ca1d-e5a2-c916-5bb8-718042960fa4/mza_12497248471165359332.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/previa-alliance-podcast/view", "description_en": "There are few experiences as universal to human existence as pregnancy and childbirth, and yet its most difficult parts — perinatal mood and anxiety disorders (PMADs) — are still dealt with in the shadows, shrouded in stigma. The fact is 1 in 5 new and expecting birthing people will experience a PMAD, yet among those who do many are afraid to talk about it, some are not even aware they’re experiencing one, and others don’t know where to turn for help. The fact is, when someone suffers from a maternal mental health disorder it affects not only them, their babies, partners, and families - it impacts our communities.In the Previa Alliance Podcast series, Sarah Parkhurst and Whitney Gay are giving air to a vastly untapped topic by creating a space for their guests — including survivors of PMADs and healthcare professionals in maternal mental health — to share their experiences and expertise openly. And in doing so, Sarah and Whitney make it easy to dig deep and get real about the facts of perinatal mental health, fostering discussions about the raw realities of motherhood. Not only will Previa Alliance Podcast listeners walk away from each episode with a sense of belonging, they’ll also be armed with evidence-based tools for healing, coping mechanisms, and the language to identify the signs and symptoms of PMADs — the necessary first steps in a path to treatment. The Previa Alliance Podcast series is intended for anyone considering pregnancy, currently pregnant, and postpartum as well as the families and communities who support them.Sarah ParkhurstPrevia Alliance Podcast Co-host; Founder & CEO of Previa AllianceA postpartum depression survivor and mom to two boys, Sarah is on a mission to destigmatize the experiences of perinatal mood and anxiety disorders (PMADs), and to educate the world on the complex reality of being a mom. Sarah has been working tirelessly to bring to light the experiences of women who have not only suffered a maternal mental health crisis but who have survived it and rebuilt their lives. By empowering women to share their own experiences, by sharing expert advice and trusted resources, and by advocating for health care providers and employers to provide support for these women and their families, Sarah believes as a society we can minimize the impact of the current maternal mental health crisis, while staving off future ones. Whitney Gay Previa Alliance Podcast Co-host; licensed clinician and therapist For the past ten years, Whitney has been committed to helping women heal from the trauma of a postpartum mental health crisis as well as process the grief of a miscarriage or the loss of a baby. She believes that the power of compassion paired with developing critical coping skills helps moms to heal, rebuild, and eventually thrive. In the Previa Alliance Podcast series, Whitney not only shares her professional expertise, but also her own personal experiences of motherhood and recovery from grief. Follow us on Instagram @Previa.Alliance", "slug": "previa-alliance-podcast", "description_zh": "育儿联盟类播客。"}, {"rank": 21, "title": "Koala Moon: Kids Bedtime Stories & Sleep Stories for Kids Podcast", "author": "Kids Bedtime Stories by Koala Moon | Starglow Media", "genre": "Stories for Kids", "rss": "https://feeds.megaphone.fm/HAPPY1668236391", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/cc/0e/95/cc0e9512-d68e-9b0d-11ca-f7c9a1ea900b/mza_6051031004986590180.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/koko-sleep-kids-bedtime-stories-meditations/view", "description_en": "Transform bedtime into the most magical part of the day with Koala Moon: Kids Bedtime Stories, the number one kids podcast trusted by families around the world. With over 50 million listens, this beloved show creates the perfect shared listening experience where parents and children can enjoy enchanting bedtime stories for kids that spark imagination, bring calm, and strengthen family bonds. Upgrade to Koko Club to support the show, unlock bonus episodes and listen to all episodes Ad-free: kokoclub.supercast.com --- Every episode features original, fun kids bedtime stories written in-house and lovingly narrated by the soothing voice of Abbe Opher. These aren’t just bedtime stories though. They are carefully crafted sleep stories for kids that help little ones relax, unwind and fall asleep with ease. All of our kids bedtime stories blend gentle narration and relaxing sleep sounds to create the perfect sleep sanctuary. Koala Moon is designed to suppor bb.jpg", "podfollow_url": "https://podfollow.com/disgraceland/view", "description_en": "DISGRACELAND is an award-winning music and true crime podcast about musicians getting away with murder and behaving very badly. Jerry Lee Lewis's 5th wife? Dead. Sid and Nancy? Both dead. Why? Because musicians are insane, and insane things happen to them. Why did we lose Amy Winehouse at 27? Was Debbie Harry really abducted by Ted Bundy as she claims? Is Patti Smith not just the \"Godmother of Punk\", but also the \"Original True Crime Girl\"? What really happened the night of the Jay Z nightclub stabbing? What do the Diddy indictments truly reveal? All these stories and more, on artists from every genre and their true crimes, in our massive 260-plus story archive. The Dead, the Stones, Johnny, Willie, Frank, Kurt, Courtney, Gaga, Lana, Taylor, and too many to name. DISGRACELAND is music history come to life through audio storytelling as you've never heard it before, with revealing facts: yes, assassins are the real reason the Beatles quit touring—reclaimed myths: no, Mama Cass didn't die from choking on a ham sandwich––and constant reckoning between art and artist––all told through the lens of true crime. This is the podcast for the self-proclaimed \"Disgos\", the musically obsessed and the true crime heads; the outsiders, the independent thinkers who know that the best history is the history that gets buried. DISGRACELAND is where host Jake Brennan tells the stories they didn't want told. The kind you'll end up telling someone else. Get ready to uncover hidden truths and buckle up for truly edge-of-your-seat storytelling. New, fully scripted, sound-designed episodes are released every Tuesday. Bonus chat-style episodes where Jake responds to voicemails, texts, and emails from Disgos hit on Thursdays, and \"Rewind\" episodes from our archive drop on Sundays. DISGRACELAND is not a journalistic podcast. It's an entertainment podcast inspired by true events. Certain dialogue and s follow.com/science-of-perception-box/view", "description_en": "Join renowned scientists Dr. Heather Berlin and Dr. Christof Koch on the Science of Perception Box, where they delve into the Perception Box—a groundbreaking concept developed by Elizabeth R. Koch, that reveals how our beliefs, biases, and neural wiring shape our reality and define how we experience the world. Through captivating conversations with expert guests like psychiatrist Dr. Judson Brewer, anthropologist Dr. Helen Fisher, and journalist Michael Pollan, the show explores how the Perception Box expands in states of awe, curiosity, and love, and contracts during fear, anxiety, or anger. From mindfulness and romantic relationships to psychedelics and human connection, each episode uncovers transformative insights into unlocking greater awareness, fostering curiosity, and reshaping how we perceive the world. New episodes drop every Thursday on YouTube, Spotify, Apple Podcasts, Amazon Music, or wherever you listen to podcasts. Follow the journey and redefine your reality.", "slug": "science-of-perception-box", "description_zh": "Unlikely Collaborators 出品的认知科学类播客，探讨人类感知与认知机制。"}, {"rank": 5, "title": "Ologies with Alie Ward", "author": "Alie Ward", "genre": "Science", "rss": "https://feeds.simplecast.com/FO6kxYGj", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts125/v4/44/4e/42/444e42f6-1ce8-1e7b-2d50-4ed506c27004/mza_18370866018545460916.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/ologies-with-alie-ward/view", "description_en": "Volcanoes. Trees. Drunk butterflies. Mars missions. Slug sex. Death. Beauty standards. Anxiety busters. Beer science. Bee drama. Take away a pocket full of science knowledge and charming, bizarre stories about what fuels these professional -ologists' obsessions. Humorist and science correspondent Alie Ward asks smart people stupid questions and the answers might change your life.", "slug": "ologies-with-alie-ward", "description_zh": "Alie Ward 主持的 nd anyone who thinks a Roman tax policy discussion sounds like a lullaby. Lay back, close your eyes", "slug": "boring-history-for-sleep", "description_zh": "Velvet 出品的助眠类播客，用枯燥的历史内容帮助听众入睡。"}, {"rank": 8, "title": "Big Ideas Lab", "author": "Mission.org", "genre": "Physics", "rss": "https://feeds.simplecast.com/WfThhbae", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/da/1b/ed/da1bedd0-daa5-5aac-d802-aa465382eef4/mza_5929512303487909442.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/big-ideas-lab/view", "description_en": "Your exploration inside Lawrence Livermore National Laboratory. Hear untold stories, meet boundary-pushing pioneers and get unparalleled access to groundbreaking science and technology. From national security challenges to computing revolutions, discover the innovations that are shaping tomorrow, today.", "slug": "big-ideas-lab", "description_zh": "Mission.org 出品的物理学类播客，访谈前沿科学家，探讨重大科学理念。"}, {"rank": 9, "title": "Health Optimization Medicine Podcast", "author": "Health Optimization Medicine and Practice", "genre": "Life Sciences", "rss": "https://rss.libsyn.com/shows/454677/destinations/3824325.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/0f/0c/94/0f0c9449-70c4-69d5-a3e0-c25df3dcfa30/mza_17754862318168047684.png/600x600bb.jpg", "podfollow_url": "https://podfollow.com/smarter-not-harder/view", "description_en": "The Health Optimization Medicine Podcast is dedicated to offering one-cent solutions to life's $64,000 questions across health optimization, decision-making, consciousness, performance, and human potential. Produced by Health Optimization Medicine & Practice (HOMeHOPe) and Smarter Not Harder, Inc., the makers of Troscriptions, this podcast bridges rigorous science with real-world clinical application. Each episode features in-depth conversations with leading researchers, clinicians, and original thinkers, including Karl Friston, Donald Hoffman, Anna Lembke, Adam Robinson, and Dominic D'Agostino. Together, they explore how small, precise interventions can create meaningful and lasting impact. Hosted by: + Dr. Ted Achacoso, founding pioneer of HOMeHOPe and Smarter Not Harder, Inc. + Dr. Scott Sherr, COO of HOMeHOPe and Smarter Not Harder, Inc. + Boomer Anderson, CEO of HOMeHOPe and Smarter Not Harder, Inc. + Jodi Duval, principal naturopath, formulator at Revital Health in Perth, Australia, and CEO of HOMeHOPe Australia New episodes every Wednesday. Previously published as the Smarter Not Harder Podcast (SNH Podcast).", "slug": "smarter-not-harder", "description_zh": "预防医学类播客。"}, {"rank": 10, "title": "Science Friday", "author": "Science Friday and WNYC Studios", "genre": "Life Sciences", "rss": "https://feeds.simplecast.com/h18ZIZD_", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/0a/a3/e2/0aa3e2a9-dda9-a7ea-8711-490d7f6c5c55/mza_1538698271404318803.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/science-friday/view", "description_en": "Covering the outer reaches of space to the tiniest microbes in our bodies, Science Friday is the source for entertaining and educational stories about science, technology, and other cool stuff.", "slug": "science-friday", "description_zh": "Science Friday 与 WNYC Studios 联合出品的科学类播客，每周五更新，讨论当周重要科学新闻与发现，由 Ira Flatow 主持。"}, {"rank": 11, "title": "Get Obsessed : With Living Your Best Life", "author": "Julie Lokun and Mika Altidor", "genre": "Social Sciences", "rss": "https://feeds.simplecast.com/Kxn0Lajf", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/8e/d3/a5/8ed3a508-0347-788f-d2f9-40b23040302d/mza_5284682999925399537.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/get-obsessed-with-living-your-best-life/view", "description_en": "What happens when two women who refuse to play small sit down with the people actually changing the world — and the ones brave enough to tell the stories most shows won't touch? You get The Get Obsessed Podcast — a show built for people who are hungry for more truth, more transformation, and more proof that the life they're imagining is actually possible. Hosted by Julie Lokun and Mika Altidor, this is the podcast for dreamers who are done dreaming and ready to move. Julie is a legal advocate, entrepreneur, and mother of four who has spent years studying what it truly takes to succeed. Mika is a fierce business owner and meditation facilitator obsessed with self-development who knows what it takes to turn a life around. Together they bring zero filters, radical honesty, and an unshakable belief that you were built for more than you've been told. We go places other podcasts won't. We have explored the inner world of Scientology — the beliefs, the pull, the controversy, and what it means for the people inside it. We sat with Janelle Brown from TLC's Sister Wives and went deep into what it really looks like to live outside the lines of what society calls normal, to question everything, and to find your own definition of family and freedom. Dr. Christine Marie, featured in the #1 Netflix documentary Trust Me: The False Prophet, joined us to unpack manipulation, control, and how even the smartest people can be led astray — and more importantly, how to find your way back. These are not comfortable conversations. They are necessary ones. And then there are the guests who show up to teach you how to build. Gary Vaynerchuk on turning obsession into empires. Evan Carmichael on finding your purpose and never letting go. David Meltzer on staying grateful and driven when the odds are stacked against you. Jim Kwik, author of Limitless, on unlocking what your mind is actually capable of. Dr. Laura Berman — Oprah's go-to love expert — on grief, healing, and choosing to keep living fully. Dr. Nadine Macaluso on trauma and reclaiming your story. Dr. Sherrie Campbell on breaking free from toxic relationships for good. Gina DeVee, the woman who inspired this show to exist, on building a life entirely on your own terms. Kim D. from The Real Housewives and Lt. Joe Kenda, the Homicide Hunter, on the stories that shape us. At the heart of every episode is one question: how do we actually live our best life — not the curated version, not the one we perform for others, but the real one? The one that lights us up, challenges us, and makes us feel fully alive. That is what we are building here, one conversation at a time. New episodes every week. Apply to be a guest at www.getobsessedguest.com. Explore everything at www.getobsessedpodcast.com and www.getobsessedpod.com. Reach us at hello@getobsessedmedia.com — we read every single message. Follow us on Instagram @getobsessedpodcast and Facebook — and tell us who you want to hear from next, or how YOU are living your best life. This community is built on your stories too. We are all in this together.", "slug": "get-obsessed-with-living-your-best-life", "description_zh": "Julie Lokun 与 Mika Altidor 联合主持的社会科学类播客，探讨如何过上理想生活。"}, {"rank": 12, "title": "Care More Be Better: A Podcast For Sustainable Social Impact and Regeneration", "author": "Corinna Bellizzi", "genre": "Earth Sciences", "rss": "https://feeds.simplecast.com/RkKDS3Sf", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/db/9f/e7/db9fe77b-c82d-b9c5-f3f7-0935a04b42e5/mza_623520508894231961.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/care-more-be-better-a-podcast-for-sustainable-social-impact-and-regeneration/view", "description_en": "Care More Be Better, invites you to care more so we can create a better world together. We amplify the voices of environmentalists, activists, health and nutrition gurus, scientists, and leading experts who seek to make the world a better place. Over the course of more than 250 interview episodes, you'll hear from experts like Jean-Michel Cousteau, Paul Hawken, Nina Simons, Dr. Wallace J. Nichols, Captain Liz Clark, Dr. William Li, Miyoko Schinner, John Roulac, Chef Babette Davis, Kelly Reyerson (@glyphosategirl), Donna Grantis and many more. These global change agents and activists create positive impacts and encourage us to think globally while also acting locally. Listen for free on Apple Podcasts, Spotify, Amazon Music, Audible, on our website, and on most major podcast platforms. Inspired by Paul Hawken’s aspirational book Regeneration - Ending The Climate Crisis In One Generation, and the late Dr. Wallace J. Nichols' Blue Mind Movement, this show aims to create a realistic roadmap to build a better future. As Paul Hawken simply states: “Global warming is not a science problem. It’s a human problem.” On this journey, you'll become the person you aspire to be by remaining curious, thinking deeply, and listening intently while looking inward. You'll discover your internal wisdom and learn to listen to your inner voice to receive the gifts nature provides fully. Become part of the regeneration nation by expanding your knowledge of agriculture, social systems, and help us build a more circular and just economy. The stories we tell will get you thinking about how to secure the future for the human race and all Earth's inhabitants - from how you can build positive change in your local community, to how you might broaden your reach and impact globally. About Our Host: A natural products industry executive, Corinna Bellizzi helped develop and grow several responsible, sustainable nutrition brands including: Nordic Naturals and ORLO Nutrition. With these achievements and experience, Corinna went back to school to earn her MBA at Santa Clara University, and is now pursuing her PhD in Sustainability Education at Prescott College. Her colorful career and exceptional experiences fill this show with life-changing conversations and insights you're sure to benefit from. She exemplifies how to deliver genuine value, achieve bigger things, and pursue significant positive change. Care More Be Better is available on Apple Podcasts, Spotify, Amazon Music, Audible, our website and most major podcast platforms. JOIN OUR CIRCLE. BUILD A GREENER FUTURE! https://caremorebebetter.com Remember, our aim with Care More Be Better is to help you use less, waste less, and live more! Engage with us on Instagram, Facebook, and TikTok!", "slug": "care-more-be-better-a-podcast-for-sustainable-social-impact-and-regeneration", "description_zh": "Corinna Bellizzi 主持的可持续发展类播客，讨论社会影响力投资与环保再生。"}, {"rank": 13, "title": "Short Wave", "author": "NPR", "genre": "Life Sciences", "rss": "https://feeds.npr.org/510351/podcast.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/17/27/45/17274534-c924-edae-c6ca-c412724c96ae/mza_4098925705315309992.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/short-wave/view", "description_en": "New discoveries, everyday mysteries, and the science behind the headlines — in just under 15 minutes. It's science for everyone, using a lot of creativity and a little humor. Join hosts Emily Kwong and Regina Barber for science on a different wavelength. Support public media by joining NPR+ at plus.npr.org. You’ll get perks for over 25 NPR podcasts, including sponsor-free listening for Short Wave.", "slug": "short-wave", "description_zh": "NPR 出品的短科学新闻播客，每集一个科学话题，时长较短，适合快速了解最新科学发现。"}, {"rank": 14, "title": "Science Vs", "author": "Spotify Studios", "genre": "Science", "rss": "https://feeds.megaphone.fm/sciencevs", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/62/15/18/621518e5-8eb3-392b-25a7-e7444aab86b6/mza_815589518502039493.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/science-vs-1/view", "description_en": "There are a lot of fads, blogs and strong opinions, but then there’s SCIENCE. Science Vs is the show from Spotify Studios that finds out what’s fact, what’s not, and what’s somewhere in between. We do the hard work of sifting through all the science so you don't have to and cover everything from 5G and ADHD, to Fluoride and Fasting Diets.", "slug": "science-vs-1", "description_zh": "Spotify Studios 出品的科普类播客，由 Wendy Zukerman 主持，用科学方法验证流行健康传言与伪科学，风格理性、犀利。"}, {"rank": 15, "title": "Blurry Creatures", "author": "Blurry Creatures", "genre": "Nature", "rss": "https://rss.pdrl.fm/6f2cf2/feeds.megaphone.fm/blurrycreatures", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/85/25/ad/8525adf3-be9a-7963-a08e-ff24771b9327/mza_14013259081946136509.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/blurry-creatures/view", "description_en": "There is more going on than what you can see. Blurry Creatures is the podcast that takes the strange, the unexplained, and the flat-out weird seriously, and asks what the Bible actually has to say about it. Every week, hosts Luke Rodgers and Nate Henry dig into the topics most people are afraid to touch. UFOs and UAPs. Cryptids and creatures. The Nephilim, the Watchers, and the sons of God. The divine council, cosmic geography, and the spiritual war happening just past the edge of our vision. Rooted in a biblical framework, the show pulls ancient texts, real witness testimony, and honest questions into the same conversation. This is not fringe for the sake of fringe. It is graduate-level theology, academic discussion, and real-world testimony made for regular people, with room for wonder, a healthy dose of humor, and a refusal to pretend the supernatural stopped being real. Whether you are a lifelong believer, a curious skeptic, or someone who has seen something you cannot explain, there is a seat for you here. Come for the mystery. Stay for the truth that holds it all together. New episodes every week.", "slug": "blurry-creatures", "description_zh": "Blurry Creatures 出品的自然类播客，探索大脚怪等未知生物的目击报告与传说。"}, {"rank": 16, "title": "Suspicious Minds: AI and the Apocalypse", "author": "Agoric Media", "genre": "Social Sciences", "rss": "https://rss.art19.com/suspicious-minds", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/66/c9/5d/66c95da6-3ed6-20fc-7a54-8fd6cdf3c237/mza_81406979434027984.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/suspicious-minds-ai-and-psychosis/view", "description_en": "The Doomsday Clock is set to 85 seconds until midnight — the closest it has ever been in its 79-year history. The world is at war. And the people building the most powerful technology in human history are warning, in public, that it might kill us all.Season One of Suspicious Minds examined what happens when AI fractures individual minds. Season Two asks a harder question: what happens when it shatters our collective sense of the future?Our ancestors have predicted the end of the world since ancient times. Thus far, they have always been wrong. So what does our eternal obsession with the apocalypse reveal about the human mind?This season is a meditation on life, death, and what it means to be alive in an age when humanity is creating something that those building it believe has the power to either end all life on Earth or turn our world into a utopia.Suspicious Minds is a two-time Webby Award-nominated podcast, and Official Selection of the 2026 Tribeca Festival Creators Market. Season One is available now. Season Two episodes drop weekly. Follow now wherever you listen so you don’t miss an episode. From Wondermind and Agoric MediaExecutive Producers Mandy Teefey and Selena GomezSubscribe to our newsletter to stay updated on all things Suspicious Minds and more: https://agoricmedia.substack.com/ If you’ve had an experience with AI that you’d like to share with us, please contact us: info@agoricmedia.comhttps://www.agoricmedia.com/suspicious-mindshttps://www.instagram.com/agoricmedia/https://www.tiktok.com/@agoricmediahttps://www.youtube.com/@agoricmedia", "slug": "suspicious-minds-ai-and-psychosis", "description_zh": "Agoric Media 出品的 AI 与末日论类播客。"}, {"rank": 17, "title": "Sasquatch Chronicles", "author": "Sasquatch Chronicles - Bigfoot Encounters", "genre": "Natural Sciences", "rss": "https://rss.libsyn.com/shows/268889/destinations/2049179.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts115/v4/bf/4c/04/bf4c0485-bed0-3206-ce8b-3332433433c0/mza_849656122803846986.png/600x600bb.jpg", "podfollow_url": "https://podfollow.com/sasquatch-chronicles/view", "description_en": "Some encounters change the way you see the world. Since 2013, Sasquatch Chronicles has given a voice to the people who have experienced something they cannot easily explain. What began as a place for ordinary people to tell their Sasquatch encounters has grown into one of the longest-running and most prolific podcasts dedicated to eyewitness accounts of Bigfoot and the unexplained. Here, witnesses (not experts, agendas, or preconceived conclusions) take center stage. Every week, host Wes Germer sits down with eyewitnesses, researchers, investigators, and others who have ventured into the mystery surrounding Sasquatch. These are firsthand accounts of encounters in the forests, mountains, backyards, and remote places where people have come face-to-face with something they never expected to see. Some stories are frightening. Some are fascinating. Some are difficult to explain. And some leave even the witness questioning what they thought was possible. From recent sightings and historic encounters to strange sounds, unexplained activity, evidence, research, and the latest developments in the world of Sasquatch, Sasquatch Chronicles explores the mystery through the voices of the people who experienced it for themselves. Join us every Sunday on our website or the podcast player of your choice as we chronicle the mystery of Sasquatch. To become a Member and get additional shows, please visit our website at www.sasquatchchronicles.com", "slug": "sasquatch-chronicles", "description_zh": "大脚怪目击故事类播客。"}, {"rank": 18, "title": "Unexplainable", "author": "Vox", "genre": "Life Sciences", "rss": "https://feeds.megaphone.fm/VMP9331026707", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/eb/87/4d/eb874d60-4424-62df-a136-d5b5f32c451b/mza_11680166435885601347.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/unexplainable/view", "description_en": "Unexplainable&nbsp;takes listeners right up to the edge of what we know…and then keeps on going. The&nbsp;Unexplainable&nbsp;team — Noam Hassenfeld, Julia Longoria, Byrd Pinkerton, and Meradith Hoddinott — tackles scientific mysteries, unanswered questions, and everything we learn diving into the unknown. New episodes Mondays and Wednesdays. From Vox and the Vox Media Podcast Network.", "slug": "unexplainable", "description_zh": "Vox 出品的科学未解之谜类播客。"}, {"rank": 19, "title": "Making Sense with Sam Harris", "author": "Sam Harris", "genre": "Science", "rss": "https://rss.libsyn.com/shows/94577/destinations/480596.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts123/v4/5b/70/e7/5b70e7ed-6c28-654b-99b1-f243bff3dbe5/mza_8512518449833623366.png/600x600bb.jpg", "podfollow_url": "https://podfollow.com/making-sense-with-sam-harris/view", "description_en": "Join neuroscientist, philosopher, and five-time New York Times best-selling author Sam Harris as he explores important and controversial questions about the mind, society, current events, moral philosophy, religion, and rationality—with an overarching focus on how a growing understanding of ourselves and the world is changing our sense of how we should live. Sam is also the creator of the Waking Up app. Combining Sam's decades of mindfulness practice, profound wisdom from varied philosophical and contemplative traditions, and a commitment to a secular, scientific worldview, Waking Up is a resource for anyone interested in living a more examined, fulfilling life—and a new operating system for the mind. Waking Up offers free subscriptions to anyone who can't afford one, and donates a minimum of 10% of profits to the most effective charities around the world. To learn more, please go to WakingUp.com. Sam Harris received a degree in philosophy from Stanford University and a Ph.D. in neuroscience from UCLA.", "slug": "making-sense-with-sam-harris", "description_zh": "Sam Harris 主持的科学与哲学类播客，讨论意识、道德、AI 等话题。"}, {"rank": 20, "title": "The Rest Is Science", "author": "Goalhanger", "genre": "Physics", "rss": "https://feeds.megaphone.fm/GLT6907573392", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/b5/7d/0c/b57d0c08-17e6-0ec9-484a-491f759d48b7/mza_3391787018699283273.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-rest-is-science/view", "description_en": "Join mathematician Professor Hannah Fry and science creator Michael Stevens (Vsauce) as they dig into the weird scientific questions that often go unexplored. Welcome to The Rest Is Science, a show that sits in the fascinating space between what we think we know, and what we actually know. Why do we assume we understand things like time, randomness, or even gravity? Once you start questioning these familiar ideas, reality becomes astonishingly strange and completely fragile. Whether you're a lifelong science fan or just naturally curious, The Rest Is Science will change your perception of reality, and prove that the biggest questions are always the most fun.", "slug": "the-rest-is-science", "description_zh": "Goalhanger 出品的科学普及类播客。"}, {"rank": 21, "title": "Tooth & Claw: True Stories of Animal Attacks", "author": "Wes Larson, Jeff Larson, Mike Smith | Daylight Media", "genre": "Nature", "rss": "https://feeds.megaphone.fm/QCD9705695442", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts112/v4/5c/df/0e/5cdf0e29-996d-68d1-1edf-825445faef5e/mza_3746222126394612906.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/tooth-claw-true-stories-of-animal-attacks/view", "description_en": "True stories of the most extreme wild animal attacks ever documented, told and explained by Wes Larson, a wildlife biologist and animal behavior expert. Wes is joined by his brother Jeff and their mutual friend Mike, and in odcast in the world, and winner of the first ever Pulitzer Prize for a radio show or podcast. Hosted by Ira Glass and produced in collaboration with WBEZ Chicago.", "slug": "this-american-life", "description_zh": "This American Life 出品的纪实类播客，由 Ira Glass 主持。每集一个主题，通过普通人的真实故事展现美国社会的各个侧面，是叙事播客的开创者与标杆，曾获多项普利策奖提名。"}, {"rank": 6, "title": "Freakonomics Radio", "author": "Freakonomics Radio + Stitcher", "genre": "Documentary", "rss": "https://feeds.simplecast.com/Y8lFbOT4", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts115/v4/f7/0c/c5/f70cc540-ce36-d96f-b111-c970aad5505c/mza_17703422762227531425.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/freakonomics-radio/view", "description_en": "Freakonomics co-author Stephen J. Dubner uncovers the hidden side of everything. Why is it safer to fly in an airplane than drive a car? How do we decide whom to marry? Why is the media so full of bad news? Also: things you never knew you wanted to know about wolves, bananas, pollution, search engines, and the quirks of human behavior. To get every show in the Freakonomics Radio Network without ads and a monthly bonus episode of Freakonomics Radio, start a free trial for SiriusXM Podcasts+ on Apple Podcasts or by visiting siriusxm.com/podcastsplus.", "slug": "freakonomics-radio", "description_zh": "Stephen J. Dubner 主持的经济类播客，基于《魔鬼经济学》一书，用经济学视角解读日常生活中的有趣现象，风格反直觉、引人深思。"}, {"rank": 7, "title": "Happy Hour with Ina Garten", "author": "Vox Media", "genre": "Society & Culture", "rss": "https://feeds.megaphone.fm/VMP2612107147", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/63/95/85/63958592-550c-9c6c-8319-2818cd10a3ad/mza_15908877599917864646.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/happy-hour-with-ina-garten/view", "description_en": "Beloved hostess Ina Garten welcomes listeners into her New York City apartment for Happy Hour with Ina Garten. Every Wednesday, she sits down with people she’d like to meet from the worlds of cu         const categories = Object.keys(podcasts);
        let currentCategory = categories[0];

        // 渲染 Tab
        const tabsEl = document.getElementById('tabs');
        categories.forEach(cat => {
            const tab = document.createElement('button');
            tab.className = 'tab' + (cat === currentCategory ? ' active' : '');
            tab.textContent = cat;
            tab.onclick = () => {
                currentCategory = cat;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                renderGrid();
            };
            tabsEl.appendChild(tab);
        });

        // 渲染网格
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            podcasts[currentCategory].forEach((p, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${p.thumbnail}" alt="${p.title}" loading="lazy">
                    <div class="info">
                        <div class="title">${idx + 1}. ${p.title}</div>
                        <div class="author">${p.author}</div>
                    </div>
                `;
                card.onclick = () => openModal(p);
                grid.appendChild(card);
            });
        }

        // 打开详情
        function openModal(p) {
            document.getElementById('modal-img').src = p.thumbnail;
            document.getElementById('modal-title').textContent = p.title;
            document.getElementById('modal-author').textContent = p.author;
            document.getElementById('modal-desc-en').textContent = p.description_en || '';
            
            const zhEl = document.getElementById('modal-desc-zh');
            if (p.description_zh) {
                zhEl.textContent = p.description_zh;
                zhEl.parentElement.style.display = 'block';
            } else {
                zhEl.parentElement.style.display = 'none';
            }
            
            const rssEl = document.getElementById('modal-rss');
            if (p.rss) {
                rssEl.href = p.rss;
                rssEl.style.display = 'inline-block';
            } else {
                rssEl.style.display = 'none';
            }
            
            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
        }

        document.getElementById('modal').onclick = (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        };

        renderGrid();
    </script>
