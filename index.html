    <script>
        const podcasts = {"All Podcasts": [{"rank": 1, "title": "The Daily", "author": "The New York Times", "genre": "Daily News", "rss": "https://feeds.simplecast.com/Sl5CSM3S", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/ab/64/66/ab6466a9-9a7d-e20e-7a3d-bc5be37d29ce/mza_15084852813176276273.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-daily/view", "description_en": "This is what the news should sound like. The biggest stories of our time, told by the best journalists in the world. Hosted by Michael Barbaro, Rachel Abrams and Natalie Kitroeff. Twenty minutes a day, six days a week, ready by 6 a.m. Subscribe today at nytimes.com/podcasts or on Apple Podcasts, Spotify and Amazon Music. You can also subscribe via your favorite podcast app here https://www.nytimes.com/activate-access/audio?source=podcatcher.", "slug": "the-daily", "description_zh": "《纽约时报》出品的每日新闻播客，2017年2月开播，由 Michael Barbaro 主持，现由 Rachel Abrams、Natalie Kitroeff 联合主持。每集约20分钟，深度拆解当天最重大的新闻事件，通常包含对时报一线记者的访谈。该节目开创了主流媒体每日新闻播客的形态，是全球下载量最高的新闻类播客之一，单集下载量超过400万次。"}, {"rank": 2, "title": "Crime Junkie", "author": "Audiochuck", "genre": "True Crime", "rss": "https://feeds.simplecast.com/qm_9xx0g", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts126/v4/8c/35/04/8c350430-2fbf-98d0-0a25-00b76550ffeb/mza_13445204151221888086.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/crime-junkie/view", "description_en": "Does hearing about a true crime case always leave you scouring the internet for the truth behind the story? Dive into your next mystery with Crime Junkie. Every Monday, join your host Ashley Flowers as she unravels all the details of infamous and underreported true crime cases with her best friend Brit Prawat. From cold cases to missing persons and heroes in our community who seek justice, Crime Junkie is your destination for theories and stories you won’t hear anywhere else. Whether you're a seasoned true crime enthusiast or new to the genre, you'll find yourself on the edge of your seat awaiting a new episode every Monday. If you can never get enough true crime... Congratulations, you’ve found your people. Follow to join a community of Crime Junkies! Crime Junkie is presented by Audiochuck Media Company.", "slug": "crime-junkie", "description_zh": "由 Audiochuck 公司出品、Ashley Flowers 与 Brit Prawat 联合主持的真实犯罪类播客，2017年开播，每周一更新。节目讲述已破与未破谋杀案、失踪案、神秘死亡等真实案件，风格如同两个好友坐在一起聊案件，兼具叙事性与悬念感。该节目长期位居苹果播客真实犯罪类排行榜首位，是该品类最具影响力的播客之一。"}, {"rank": 3, "title": "Dateline NBC", "author": "NBC News", "genre": "True Crime", "rss": "https://podcastfeeds.nbcnews.com/HL4TzgYC", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts115/v4/8c/00/7a/8c007a42-e550-0214-d4cb-b59cd7edf194/mza_5305664083935674472.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/dateline-nbc/view", "description_en": "Current and classic episodes, featuring compelling true-crime mysteries, powerful documentaries and in-depth investigations. Follow now to get the latest episodes of Dateline NBC completely free, or subscribe to Dateline Premium for ad-free listening and exclusive bonus content: DatelinePremium.com", "slug": "dateline-nbc", "description_zh": "NBC News 出品的老牌真实犯罪调查节目，前身为同名电视新闻杂志。节目涵盖经典与当代真实犯罪谜团、深度调查报告与人物纪实，以完整叙事和多方采访著称。作为真实犯罪品类的标杆性节目，已播出多年，积累了大量经典案件专题。"}, {"rank": 4, "title": "The Joe Rogan Experience", "author": "Joe Rogan", "genre": "Comedy", "rss": "https://feeds.megaphone.fm/GLT1412515089", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/99/08/92/990892a2-72fc-d84f-10a8-5dc6eff51fd6/mza_13906283896473041916.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-joe-rogan-experience/view", "description_en": "The official podcast of comedian Joe Rogan.", "slug": "the-joe-rogan-experience", "description_zh": "美国喜剧演员 Joe Rogan 主持的长篇访谈播客，2009年12月开播。每集时长2-3小时，嘉宾涵盖喜剧演员、科学家、政治家、运动员、作家等各领域人物，话题不受限制。该节目是长篇对谈类播客的开创者与标杆，2020年与 Spotify 签订独家发行协议，是全球听众规模最大的播客之一。"}, {"rank": 5, "title": "REAL AF with Andy ing discussions with some of the most prominent experts and influencers in the health and wellness space, best selling authors, top cardiologists, neuroscientists and more!! His work focuses on improvi...", "slug": "the-dylan-gemelli-podcast", "description_zh": "Dylan Gemelli 主持的健康与生物黑客类播客。节目邀请心脏病专家、神经科学家、畅销书作家等各领域健康专家，探讨健身、长寿、激素疗法、肽类、营养代谢等话题，主打提供无偏见的健康真相。该节目目前位列苹果播客健康健身类排行榜首位。"}, {"rank": 7, "title": "Mick Unplugged", "author": "Mick Hunt", "genre": "Self-Improvement", "rss": "https://feeds.megaphone.fm/YAP1844984381", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/f8/75/0c/f8750cf1-ca31-5d55-00a1-ce86329309d5/mza_11785095184998327365.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/mick-unplugged/view", "description_en": "Everybody talks about your WHY. Mick Hunt goes deeper. Mick Unplugged is the leadership and personal growth podcast built on one idea: your BECAUSE is the purpose underneath your purpose, and it is the most powerful force you own. Hosted by Mick Hunt, USA Today bestselling author and the voice of Modern Leadership, every episode sits across from a high performer, founder, athlete, or culture-shaper and asks the one question they cannot fake an answer to. What is your BECAUSE? Past guests include Shark Tank stars Daymond John and Kevin O'Leary, entrepreneur Gary Vaynerchuk, motivational legend Les Brown, Chef Robert Irvine, comedians Rickey Smiley and Earthquake, NFL Hall of Famer Jared Allen, hospitality mogul David Grutman, and World Series champion Jeremy Guthrie. No scripts. No surface-level fluff. Just the real fire behind why they refused to quit. If you are a leader, an entrepreneur, or someone who is done coasting on motivational quotes, this is your show. You will walk away every week with mindset shifts, leadership strategy, and the kind of straight talk that actually moves you forward. New episodes drop weekly. Follow Mick Unplugged on Apple Podcasts, Spotify, and YouTube so you never miss one. Your BECAUSE is your Superpower. Go Unleash It.", "slug": "mick-unplugged", "description_zh": "Mick Hunt 主持的领导力与个人成长类播客。节目的核心概念是「你的 Because」——即驱动一个人做所有事的根本动力。每集访谈一位高绩效人士、创始人或运动员，探讨其背后的动力来源。主持人 Mick Hunt 是《今日美国》畅销书作家、前顶级保险销售，后转型为励志演说家与企业教练，节目年收入超过700万美元。"}, {"rank": 8, "title": "20/20", "author": "ABC News", "genre": "True Crime", "rss": "https://feeds.megaphone.fm/ESP3456903052", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/81/6c/5d/816c5d57-7c3f-3df9-1557-08e17469dfe4/mza_1433648970787567135.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/20-20/view", "description_en": "Unforgettable true crime mysteries, exclusive newsmaker interviews, hard-hitting investigative reports and in-depth coverage of high profile stories. Now listen throughout the week with the official 20/20 After Show, the True Crime Vault, and our spotlight of true crime originals. Subscribe to 20/20 True Crime+ for ad-free listening, early access to new series, exclusive bonus content, and hundreds of episodes from the 20/20 true crime vault. Visit apple.co/2020truecrime to subscribe now.&nbsp; Terms apply.", "slug": "20-20", "description_zh": "ABC News 出品的老牌新闻杂志节目，后扩展为播客。内容涵盖真实犯罪谜团、深度调查报道与人物纪实，以完整叙事和深度采访著称，是美国电视史上播出时间最长的新闻杂志节目之一。"}, {"rank": 9, "title": "Morbid", "author": "Ash Kelley & Alaina Urquhart", "genre": "True Crime", "rss": "https://feeds.simplecast.com/ohmVlJZQ", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/78/e9/0e/78e90ee0-567d-1ad8-17a0-17d7c988c4bd/mza_8425901783365617933.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/morbid-a-true-crime-podcast/view", "description_en": "It’s a lighthearted nightmare in here, weirdos! Morbid is a true crime, creepy history and all things spooky podcast hosted by an autopsy technician and a hairstylist. Join us for a heavy dose of research with a dash of comedy thrown in for flavor. Subscribe to SiriusXM Podcasts+ to listen to new episodes of Morbid ad-free. Start a free trial now on Apple Podcasts or by visiting siriusxm.com/podcastsplus.", "slug": "morbid-a-true-crime-podcast", "description_zh": "Ashley Kelley 与 Alaina Urquhart 联合主持的真实犯罪类播客。节目以黑色幽默的轻松风格讲述真实犯罪案件，两位主持人的化学反应和生动叙事是节目的主要特色，在年轻听众群体中广受欢迎。"}, {"rank": 10, "title": "Passion Struck with John R. Miles", "author": "Passion Struck with John R. Miles", "genre": "Alternative Health", "rss": "https://feeds.simplecast.com/XYHE1JPs", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/e8/d7/ca/e8d7ca5c-35fa-6e90-42ec-09e168d110cc/mza_400047353205660386.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-passion-struck-podcast/view", "description_en": "You built the life you were supposed to want. So why doesn't it feel like enough? Passion Struck is the #1 Health and Fitness podcast — and it exists to answer exactly that question. I'm John R. Miles — Navy veteran, former Fortune 50 executive, bestselling author — and I built this show because I lived the \"successful but empty\" version of life myself, and I wanted to find a better way. Each week, I sit down with the world's top voices in neuroscience, psychology, medicine, and elite performance — including Angela Duckworth, Susan Cain, Robert Waldinger, Daniel Amen, and Ryan Holiday — to unpack what the research tells us about purpose, connection, and resilience, and how to apply it to your own life. Fridays, I share what I'm learning directly, in solo episodes built around the same ideas. New interviews every Tuesday and Thursday. Solo episodes every Friday.", "slug": "the-passion-struck-podcast", "description_zh": "John R. Miles 主持的健康与自我提升类播客。节目围绕如何过上充实、有目标的人生展开，邀请各领域专家探讨心理学、神经科学、健康习惯等话题，帮助听众实现个人成长。"}, {"rank": 11, "title": "Up First from NPR", "author": "NPR", "genre": "Daily News", "rss": "https://feeds.npr.org/510318/podcast.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/0e/35/25/0e352569-e694-81d9-ea55-5f935981c15a/mza_1788275989855583986.png/600x600bb.jpg", "podfollow_url": "https://podfollow.com/up-first/view", "description_en": "NPR's Up First is the news you need to start your day. The three biggest stories of the day, with reporting and analysis from NPR News — in 10 minutes. Available weekdays at 6:30 a.m. ET, with hosts Leila Fadel, Steve Inskeep, Michel Martin and A Martinez. Also available on Saturdays at 9 a.m. ET, with Ayesha Rascoe and Scott Simon. On Sundays, hear a longer exploration behind the headlines with Ayesha Rascoe on \"The Sunday Story,\" available by 8 a.m. ET. Subscribe and listen, then support your local NPR station at donate.npr.org. Support public media by joining NPR+ at plus.npr.org. You’ll get perks for over 25 NPR podcasts, including sponsor-free listening for Up First, NPR News Now, and more.", "slug": "up-first", "description_zh": "NPR 出品的每日新闻播客，每集约15分钟，速览当天最重要的三条新闻，配以 NPR 驻外记者的深度报道与分析。节目节奏紧凑，适合早晨通勤时收听，是美国最受欢迎的短新闻播客之一。"}, {"rank": 12, "title": "Pod Save America", "author": "Pod Save America", "genre": "Politics", "rss": "https://audioboom.com/channels/5166624.rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/44/dc/61/44dc6141-25e9-5bb3-e19e-a2337233d19e/mza_5506771870755587769.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/pod-save-america/view", "description_en": "Pod Save America is a no-b******t conversation about politics hosted by former Obama aides Jon Favreau, Jon Lovett, Dan Pfeiffer, and Tommy Vietor. It cuts through the noise to break down the week’s news and helps people figure out what matters and how they can help. They’re regularly joined by journalists, activists, politicians, entertainers, and world leaders. You can watch on YouTube or listen to new episodes every Tuesday, Friday and Sunday. Subscribe to Friends of the Pod! Your subscription makes Crooked’s work possible and gives you access to ad-free episodes of Pod Save America and Pod Save the World, plus exclusive content and a lively Discord community. Learn more and subscribe at crooked.com/friends or on Apple Podcasts. For a transcript of an episode of Pod Save America, please email transcripts@crooked.com.", "slug": "pod-save-america", "description_zh": "由前奥巴马政府工作人员主持的自由主义政治评论播客。节目以无滤镜、直接的风格讨论美国政治与时事，嘉宾多为民主党政客、策略师与记者，是美国进步派听众中最具影响力的政治播客之一。"}, {"rank": 13, "title": "Unblinded with Sean Callagy", "author": "Sean Callagy", "genre": "Business", "rss": "https://anchor.fm/s/10a340624/podcast/rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/fe/73/39/fe733903-aac9-857a-7e0d-97da75f26739/mza_7400622169884755798.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/unblinded-with-sean-callagy/view", "description_en": "What if you could see what others don’t—and unlock the hidden patterns that quietly drive every outcome in business, relationships, and life? Hosted by entrepreneur, attorney, philanthropist, and world-class communicator Sean Callagy, Unblinded is where peak performance meets integrity and possibility. Sean—legally blind since childhood—defied the odds to build multiple eight-figure companies, reinvent industries, and train thousands of leaders in the art of influence. His message is clear: influence is not manipulation, it’s mastery—and when harnessed for good, it transforms everything.", "slug": "unblinded-with-sean-callagy", "description_zh": "企业家、律师 Sean Callagy 主持的深度访谈播客。嘉宾阵容包括 Mike Tyson、漫威影业前总裁 David Maisel、Google 前首席决策科学家 Cassie Kozyrkov 等各界人物。对话内容涉及成功、影响力、韧性、个人成长与商业智慧，风格真实、深入。"}, {"rank": 14, "title": "Proven Podcast", "author": "Charles Schwartz", "genre": "Entrepreneurship", "rss": "https://rss.libsyn.com/shows/526583/destinations/4528548.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/79/33/d2/7933d22b-9392-7d2c-714f-9a4c624003e5/mza_1012289391812617337.png/600x600bb.jpg", "podfollow_url": "https://podfollow.com/scale-it-lab/view", "description_en": "Welcome to the Proven Podcast, where it does not matter what you think, only what you can prove.", "slug": "scale-it-lab", "descrip dio?source=podcatcher.", "slug": "the-ezra-klein-show-1", "description_zh": "《纽约时报》观点版出品的深度访谈播客，由 Ezra Klein 主持。节目邀请政治、文化、科学、艺术等领域的思想者，进行长时间的深入对话，探讨塑造当今世界的重要议题。"}, {"rank": 20, "title": "Good Hang with Amy Poehler", "author": "The Ringer", "genre": "Comedy", "rss": "https://feeds.megaphone.fm/good-hang-with-amy-poehler", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/2b/94/bb/2b94bb6e-44f1-9d57-7748-b7456072806d/mza_1064202164981856225.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/good-hang-with-amy-poehler/view", "description_en": "Come hang with Amy Poehler. Each week on her podcast, she'll welcome celebrities and fun people to her studio. They'll share stories about their careers, mutual friends, shared enthusiasms, and most importantly, what's been making them laugh. This podcast is not about trying to make you better or giving advice. Amy just wants to have a good time.", "slug": "good-hang-with-amy-poehler", "description_zh": "The Ringer 出品的轻松对谈播客，由喜剧演员 Amy Poehler 主持。节目氛围轻松随意，每期邀请一位朋友或同行聊天，涵盖创意、生活、喜剧创作等话题。"}, {"rank": 21, "title": "48 Hours", "author": "48 Hours", "genre": "True Crime", "rss": "https://rss.amperwave.net/v2/feed/audacynetwork/496099a4061493caac75b71a6c26b8fb", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/c8/4f/8f/c84f8fa2-074d-6023-7f31-9c781b80dedc/mza_7616553513239265555.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/48-hours/view", "description_en": "“48 Hours” uncovers the narrative behind crime and justice cases that have left a lasting mark on society. Award-winning CBS News correspondents thoughtfully examine the complexities of each crime by transporting you to the heart of the investigation through key evidence and gripping interviews with critical figures from the case. The unmatched reporting has made a tangible difference in countless lives, leading to the exoneration of wrongly convicted individuals and the reopening — and resolution — of previously closed cold cases.Listen to a new “48 Hours” episode every Monday and then go deeper into the case on Tuesdays with the immersive “Post Mortem” series — producers and correspondents join host Anne-Marie Green to discuss key evidence, dead ends, mishaps, and stranger-than-fiction twists they faced in the field. Also available on the 48 Hours YouTube channel. Plus, every Wednesday and Thursday, we’ll revisit a classic “48 Hours” episode. Get ad-free access to 48 Hours podcasts by subscribing to 48 Hours+. Subscribe at 48HoursPodcasts.com, then listen in Apple Podcasts, Spotify, or use your private link in your favorite podcast app.", "slug": "48-hours", "description_zh": "CBS News 出品的老牌真实犯罪调查节目，前身为同名电视节目。每集聚焦一个案件，用完整的叙事结构挖掘案件背后的故事，通过多方采访和细节还原呈现案件全貌，是真实犯罪品类的经典节目。"}, {"rank": 22, "title": "The Shawn Ryan Show", "author": "Shawn Ryan", "genre": "Philosophy", "rss": "https://rss.pdrl.fm/ac69ac/feeds.megaphone.fm/WWO7410387571", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts112/v4/d0/b3/2d/d0b32d7f-ab2d-5791-83b0-854f698a9184/mza_13561258173056659752.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/shawn-ryan-show/view", "description_en": "The \"Shawn Ryan Show\" is hosted by Shawn Ryan, former U.S. Navy SEAL, CIA Contractor, and Founder of Vigilance Elite. We tell REAL stories about REAL people from all walks of life. We discuss the ups and downs, wins and losses, successes and struggles, the good and bad in a respectful but candid way with our guest. We're better than entertainment, we're the REAL thing. Please enjoy the show.", "slug": "shawn-ryan-show", "description_zh": "前美国陆军游骑兵 Shawn Ryan 主持的深度访谈播客。嘉宾多为军方、情报界、特种部队、执法界人物，探讨军事行动、情报工作、历史事件与个人经历，风格真实、硬核，在军迷与军事爱好者群体中影响很大。"}, {"rank": 23, "title": "Tony Mantor: Why Not Me ?", "author": "iHeartPodcasts", "genre": "Mental Health", "rss": "https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/cd1d67c7-7e36-4004-a3dd-b47100fdf2e3/f88acc7d-0a9e-4ed7-b448-b47100fdf2f0/podcast.rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/47/e3/cc/47e3cc28-6d02-6d9f-8b6e-42d6d87e54a6/mza_3766587543936049722.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/tony-mantor-why-not-me-the-world/view", "description_en": "Autism, Mental Health, Advocacy & Human Stories.Embracing Autism/Mental Health Worldwide.Autism is a complex neurodevelopmental condition affecting millions worldwide, characterized by challenges in social interaction, communication, and repetitive behaviors. Despite increasing recognition, there remains a lack of understanding and awareness about the condition. Mental health encompasses a range of conditions impacting emotional, psychological, and social well-being, affecting millions globally. It includes disorders like anxiety, depression, bipolar disorder, schizophrenia, and psychosis. Schizophrenia is marked by symptoms such as hallucinations, delusions, and disorganized thinking, while psychosis involves a loss of contact with reality, often presenting with similar symptoms. Despite growing awareness, stigma and misconceptions about mental health, particularly schizophrenia and psychosis, persist, underscoring the need for greater understanding and support. From celebrating neurodiversity to breaking down stigma, we create a safe space for listeners to learn, grow, and feel seen. Whether you're on the spectrum, a caregiver, or an advocate, join our global community for inspiring conversations and empowering resources that uplift and unite. Tune in to embrace understanding, healing, and hope worldwide! Together, we can create a more informed and compassionate society for individuals with Autism and Mental Illness.", "slug": "tony-mantor-why-not-me-the-world", "description_zh": "iHeartPodcasts 出品，Tony Mantor 主持的心理健康类播客。节目融合幽默与个人经历，探讨自闭症倡导、心理健康与人生韧性，以积极向上的风格传递信息。"}, {"rank": 24, "title": "Tony Mantor's : Almost Live..... Nashville", "author": "iHeartPodcasts", "genre": "Music Interviews", "rss": "https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/c41d385f-64b2-4514-9415-b4d50130ce01/d1742151-672b-4e4d-997b-b4d50130ce0c/podcast.rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/13/61/db/1361db29-4ef7-6c00-dfc6-57101ff6ac8b/mza_667531997147998547.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/tony-mantor-s-almost-live-nashville/view", "description_en": "Nashville based veteran music producer Tony Mantor’s Almost Live… Nashville podcast takes its listener on a journey through the business of music and entertainment. Following the success and popularity of his top-rated podcast on Autism & Mental Health awareness - Why Not Me? - Mantor hosts thought-provoking conversations and behind-the-scenes stories from various celebrity guests from the world of music, television and entertainment. With more than 30 years as an accomplished music producer based in Nashville, Mantor welcomes a worldly guest list of musicians, actors and entertainers who share their unique stories about the roles they’ve played in creating and sustaining what we know as popular American culture. Conversations and stories that also give a deeper understanding on what it takes to achieve success in the entertainment industry for aspiring entertainers who are currently pursuing their own dreams of being a star someday. Whether listening for the entertainment or storytelling factor alone, or for tips on how his guests faced their life’s challenges, Almost Live… Nashville will have a story for anyone who has been a fan of popular culture in music, movies and television over the last few decades.", "slug": "tony-mantor-s-almost-live-nashville", "description_zh": "iHeartPodcasts 出品，Tony Mantor 在纳什维尔录制的现场音乐访谈节目，融合音乐表演与人物对话。"}, {"rank": 25, "title": "The Learning Leader Show With Ryan Hawk", "author": "Ryan Hawk", "genre": "Management", "rss": "https://rss.libsyn.com/shows/65162/destinations/259291.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/t pe-how-we-live-and-build/view", "description_en": "The iDesign Lab Podcast explores how intentional design influences far more than interiors—it shapes the way we think, build, lead, and experience the world.Hosted by Scott Woolley and Tiffany Woolley, the show sits at the intersection of design, entrepreneurship, creativity, and human behavior. Each episode features in-depth conversations with designers, founders, creators, and innovators who are actively shaping industries and redefining how people engage with products, spaces, brands, media, and experiences.From architecture and product design to branding, storytelling, hospitality, and technology, we uncover how design thinking drives emotion, identity, connection, and business success.This is not a surface-level design show—it’s a conversation about how intentional creation impacts culture, decision-making, and the future of how we live.We explore topics such as: • How design influences behavior, emotion, and experience • Building brands and businesses through intentional design • The intersection of creativity, entrepreneurship, and innovation • Storytelling, media, and the design of modern culture • Reinvention, resilience, and the mindset behind creative success • Behind-the-scenes insights from leaders shaping their industriesWhether you're a creative professional, entrepreneur, or simply curious about how design quietly shapes your world, The iDesign Lab offers meaningful conversations and actionable insights you can apply immediately.New episodes weekly featuring conversations with leading voices in design, business, and creative innovation. For more information about iDesign Lab and Tiffany & Scott Woolley, visit the website at www.twinteriors.com/podcast and ScottWoolley.com", "slug": "the-idesign-lab-podcast-where-design-business-and-culture-shape-how-we-live-and-build", "description_zh": "Tiffany Woolley 与 Scott Woolley 联合主持的设计类播客，探讨设计、商业与文化如何共同塑造我们的生活方式与城市建筑环境。"}, {"rank": 5, "title": "99% Invisible" , and cultural voices shaping today’s economy — not just what they do, but how they actually win. From raw origin stories and early struggles to the real mechanics behind how money is made, scaled, and sometimes lost, Joe cuts through the noise to get to what matters. No fluff. No surface-level answers. Set inside the world of Coffeez, every conversation unfolds with intention — how they started, how they built, what it cost them, and what separates them now. Whether you're building something, investing in something, or simply trying to understand how the game really works, Coffeez with Joe Shalaby delivers unfiltered insight from people who are actually in it.", "slug": "coffeez-with-joe-shalaby", "description_zh": "Joseph Shalaby 主持的创业类播客，嘉宾多为各行业创始人，分享创业经历、商业经验与人生故事。"}, {"rank": 8, "title": "the bossbabe podcast", "author": "Natalie Ellis", "genre": "Entrepreneurship", "rss": "https://feeds.megaphone.fm/GRWD2947998660", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/52/a1/ab/52a1abee-87c4-c0b8-d242-a041522add49/mza_11816846594555703738.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-bossbabe-podcast/view", "description_en": "Bossbabe is one of the world's largest communities of ambitious women, with over 4.2 million followers and the top online membership for women entrepreneurs. We're passionate about helping you build a Freedom-Based Business™ to make more money + live a lifestyle you love. Every week, the bossbabe podcast brings you the real behind-the-scenes of building a wildly successful, profitable + reliable business, plus tools and strategies to make sales on repeat, grow an audience on social media, + create the life you truly want.", "slug": "the-bossbabe-podcast", "description_zh": "Natalie Ellis 主持的面向女性创业者的商业播客。节目围绕女性创业、个人品牌与商业增长展开，是全球最大的女性创业者社区之一。"}, {"rank": 9, "title": "Founder's Story", "author": "IBH Media", "genre": "Entrepreneurship", "rss": "https://feeds.simplecast.com/NVPdHs07", "thumbnail": "https://is ", "slug": "armchair-expert-with-dax-shepard", "description_zh": "Dax Shepard 与 Monica Padman 主持的喜剧访谈播客，每集邀请一位名人朋友进行长时间对话，深入探讨个人经历、心理问题与人生感悟，风格真诚、不端着。"}, {"rank": 6, "title": "Giggly Squad", "author": "Hannah Berner & Paige DeSorbo", "genre": "Comedy", "rss": "https://feeds.simplecast.com/6J0Ivoq9", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/e8/09/a6/e809a65d-03c3-82ce-383b-5586f49acc5b/mza_10887220202918113929.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/giggly-squad/view", "description_en": "Welcome to Giggly Squad. Each week, Hannah Berner and Paige DeSorbo make fun of everything, but most importantly themselves. They discuss pop culture, fashion trends, television, horoscopes, mental health, dating, and expose their personal lives. Also, they can't be managed.", "slug": "giggly-squad", "description_zh": "Hannah Berner 与 Paige DeSorbo 联合主持的喜剧播客，两位好友闲聊流行文化、真人秀、约会生活，风格轻松八卦，在年轻女性听众中很受欢迎。"}, {"rank": 7, "title": "SmartLess", "author": "Jason Bateman, Sean Hayes, Will Arnett", "genre": "Comedy", "rss": "https://feeds.simplecast.com/hNaFxXpO", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/b1/93/5f/b1935f9f-35be-9144-e813-626bd8dabfb4/mza_4132654708551836825.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/smartless/view", "description_en": "\"SmartLess\" with Jason Bateman, Sean Hayes, & Will Arnett is a podcast that connects and unites people from all walks of life to learn about shared experiences through thoughtful dialogue and organic hilarity. A nice surprise: in each episode of SmartLess, one of the hosts reveals his mystery guest to the other two. What ensues is a genuinely improvised and authentic conversation filled with laughter and newfound knowledge to feed the SmartLess mind. Subscribe to SiriusXM Podcasts+ to listen to new episodes of SmartLess ad-free and a whole week early. Start a free trial now on Apple Podcasts or by visiting siriusxm.com/podcastsplus.", "slug": "smartless", 47d3ed5ef16cb8040a8c6e", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/a4/9a/19/a49a1945-d52b-4f28-9ced-f9447b3f3ac0/mza_10728121607275949694.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-lonely-island-and-seth-meyers-podcast/view", "description_en": "Join Seth Meyers as he sits down with fellow SNL alum and comedy-music sensations The Lonely Island (Andy Samberg, Akiva Schaffer, and Jorma Taccone) to discuss their wildly popular and groundbreaking series of SNL Digital Shorts that aired on Saturday Night Live beginning in 2005. Episode by episode they'll discuss how each short was created, what the response to it was at the time, and what impact, if any, it still has today. Aided by Seth, the guys will relive their time at SNL and reminisce on the nearly 50-year-old show from a time when putting short comedy sketches on the internet was so novel that they maybe even helped launch YouTube to do it. Along the way they'll talk all things SNL from guests, fellow cast members, and favorite live sketches including many that never aired. Hosted on Acast. See acast.com/privacy for more information.", "slug": "the-lonely-island-and-seth-meyers-podcast", "description_zh": "The Lonely Island 与 Seth Meyers 联合主持的喜剧音乐播客。"}, {"rank": 28, "title": "Stavvy's World", "author": "Stavros Halkias", "genre": "Comedy Interviews", "rss": "https://feeds.simplecast.com/Fa0PP4fl", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/0e/ae/52/0eae52bf-5236-e283-7938-28d91e1820e0/mza_3099432660874981459.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/stavvys-world/view", "description_en": "A podcast where you can hang out with your pal Stav. Every week Stavros Halkias and his friends will help you solve all your problems. Wanna be a part of the show? Call 904-800-STAV, leave a voicemail and get some advice! Subscribe to SiriusXM Podcasts+ to listen to new episodes of Stavvy's World ad-free. Start a free trial now on Apple P  Lima Show debuts this Summer. New episodes every Tuesday. Your support means EVERYTHING to me and I don’t take it for granted — click the follow button and leave a review to help us spread the love with The Jamie Kern Lima Show. This is YOUR show, and I’m so honored to be on this journey with you, together! To learn more about Jamie, go deeper into the show, find the resources and research she mentions, or submit a topic or question, visit https://www.JamieKernLima.com/Show", "slug": "the-jamie-kern-lima-show", "description_zh": "Jamie Kern Lima 主持的励志与自我提升类播客。Jamie Kern Lima 是成功的企业家与励志演说家，节目围绕自信、信念与个人成长展开。"}, {"rank": 3, "title": "The Mel Robbins Podcast", "author": "Mel Robbins", "genre": "Self-Improvement", "rss": "https://feeds.simplecast.com/UCwaTX1J", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/ab/66/a5/ab66a5f5-b52b-c70a-227b-0721bd9dc660/mza_13546984924981879479.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-mel-robbins-podcast/view", "description_en": "You can change your life and Mel Robbins will show you how. The Mel Robbins Podcast is the #1 podcast on the globe for a reason: Mel’s simple, research-backed advice has changed millions of people’s lives, and in every episode, she’s giving you all her hard-fought secrets, science-backed tools, and deeply personal stories, so you can change yours too. If you’re a new listener, you’re in the right place. Every episode will empower you to create a better life and help you take a step toward the life you want. Want more? Follow along at @melrobbins Subscribe to SiriusXM Podcasts+ to listen to new episodes of The Mel Robbins Podcast ad-free. Start a free trial now on Apple Podcasts or by visiting siriusxm.com/podcastsplus.", "slug": "the-mel-robbins-podcast", "description_zh": "Mel Robbins 主持的自我提升类播客，融合心理学、神经科学与实用建议，探讨如何改变行为、克服恐惧、实现目标，风格直接、充满能量。"}, {"rank": 4, "title": "We!", "author": "Joe Mittiga", "genre": "How To", "rss": "https://rss.buzzsprout.com/2547586.rss", "th the beliefs, patterns, choices, and self-betrayals shaping the life you have now, because when you change, everything in your life changes, too. And you can finally start creating the life you actually want. Being ready for love reaches far beyond finding a romantic partner. It means becoming grounded enough to trust yourself, honest enough to face your own bullshit, and self-led enough to decide what belongs in your life. That includes the people you love, the work you pursue, the standards you hold, the pleasure you allow, and the future you are willing to create. I spent 15 years as a clinical psychotherapist before becoming the paradigm-shifting, script-flipping life disrupter you hear today. I’m part woo, part neuroscience, and entirely uninterested in recycled advice about fixing yourself, becoming more palatable, or performing your way into someone else’s approval. On Ready for Love, we challenge the ideas women have been handed about relationships, ambition, confidence, aging, anxiety, power, pleasure, success, and what it means to be a “good” woman. Some of those ideas may already feel uncomfortable. Good. Discomfort is often what happens when an old belief realizes it is about to lose its job. This is your invitation to become self, centered: more self-trusting, self-aware, self-assured, and fully in possession of your own life. You are not here to shrink, settle, or spend another decade proving how much you can tolerate. You are here to become the woman who gets what she wants without abandoning herself along the way. New episodes drop every Friday on all podcast platforms and YouTube. Follow the show and leave a five-star review. Unless you hated it, in which case your mother was right: some thoughts are best kept to yourself.", "slug": "the-hilary-silver-podcast", "description_zh": "情感关系类播客。"}, {"rank": 7, "title": "Becoming UnDone® with Dr. Toby Brooks", "author": "Dr. Toby Brooks", "genre": "Self-Improvement", "rss": "https://feeds.simplecast.com/B3LE ning the same loops. The imposter syndrome that follows you into rooms you earned. The catastrophizing that takes you to worst case at 3am when nothing on the outside is wrong. Whatever emotional pattern is getting in the way of your best performance, this is where it gets addressed. For 18 years, Coach Mike Basevic has helped leaders eliminate stress and self-doubt at the root, working with the subconscious mind instead of managing symptoms on the surface. Each episode pushes back on the labels and outdated thinking that keep high achievers stuck, and gives you tools that actually change what's going on inside. No more 3am wake-ups. No more brain fog. No more feeling like a fraud inside the life you built. If you've tried everything else and you're still fighting your own mind, this is the show that goes where the others don't. New episodes every week. Subscribe to follow along. When you're ready to go deeper, visit thebrokensage.com.", "slug": "life-is-an-inside-job-with-coach-mike-basevic", "description_zh": "Mike Basevic 教练主持的自我提升类播客，强调内在心态对人生的影响。"}, {"rank": 9, "title": "Living Your Legacy", "author": "Rudy Mawer", "genre": "Self-Improvement", "rss": "https://feeds.captivate.fm/the-living-your-legacy-podcast/", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/1b/6c/8a/1b6c8a86-092b-343b-c5d9-0f05851189ba/mza_11569768149956520460.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-living-your-legacy-podcast/view", "description_en": "A podcast that brings you closer to the individuals who have built the brands, businesses, and movements that inspire us all. Each episode features an in-depth conversation with one of the dynamic entrepreneurs from all walks of life, offering listeners a front-row seat to their journeys, insights, and expertise. Through candid dialogue, discover how these innovators turned their ideas into thriving enterprises, the challenges they overcame, and the lessons they learned along the way. From behind-the- lp you drift into peace through the gentle power of storytelling. With each soothing bedtime story, you’re invited to close your eyes, quiet your mind, and relax into a space where sleep comes easily. Your guide is Geoffrey Newland, whose warm and calming voice welcomes you twice a week into the tranquil realm of Night Falls. It’s a place touched by starlight and softened by the sound of the wind in the trees, where stories rise like mist from the hills and embers glow beside a crackling campfire. In each episode, Geoffrey shares a sleep story or retells a peaceful tale drawn from memory and magic, carefully crafted to help you get sleepy and gently release the day. Night Falls is designed especially for adults who struggle to sleep. Whether you live with insomnia or simply crave a calm and comforting end to your day, these bedtime stories for adults create a soothing bridge between wakefulness and rest. Every Sunday and Tuesday, a new story arrives to help you unwind, slow your breath, and find your way toward stillness. Each episode begins with a soft introduction before easing into the heart of the story. Some journeys take you through quiet forests or peaceful gardens, while others wander into sleepy villages and old familiar fables. These are sleepy stories told with kindness and care, always moving gently in the direction of dreams. More than just a sleep story podcast, Night Falls offers a sense of belonging to those who need company in the quiet hours. It’s a place where bedtime stories for grown-ups still hold the same comfort they did when we were young. Where soft voices and gentle rhythms help hush the noise of a long day. Where you can settle in and find your own perfect sleep cove by the falls. The stories in Night Falls speak to those who are weary and wide awake, to those seeking something soft and steady to carry them into sleep. You might find echoes of the familiar here, the kind of bedtime stories and sleep stories you’ve come to love if you often relax and get sleepy while listening to a calm, immersive narrative. Night Falls weaves together everything you need to rest. Like a hidden corner of a dream, it offers peace, patience, and a return to quiet. The world slows, the fire crackles low, and your breathing begins to match the rhythm of the tale. These bedtime stories for grown-ups are here for you whenever you need them. All our sleep stories will meet you in the night, again and again, always ready to guide you back to rest. So close your eyes. Let your body grow heavy. Let the story carry you. This is your time to get sleepy. This is your bedtime story. This is Night Falls. --- Free episodes every Tuesday and Subscriber episodes on Sundays. Subscribe on Apple Podcasts or via https://nightfalls.supercast.com/ for a rich, immersive and totally ad-free experience.", "slug": "night-falls-bedtime-stories-for-sleep", "description_zh": "Sleepiest 出品的助眠故事播客，用舒缓的声音讲述睡前故事帮助听众入睡。"}, {"rank": 26, "title": "Sherlock & Co.", "author": "Goalhanger", "genre": "Drama", "rss": "https://feeds.megaphone.fm/GLT1918729224", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/2c/1e/1a/2c1e1abf-d431-7b08-b8bd-f9018f5e9004/mza_812454313987963489.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/sherlock-co/view", "description_en": "My name is Dr. John Watson, once of the British Army Northumberland Fusilier&nbsp;Regiment, now a true crime podcaster based in Central London. I don't have much experience in criminology, so this is mostly a record of how I met possibly the most brilliant and bizarre person I have ever (and will ever) know. Join me as I document the adventures of Sherlock Holmes. This podcast is property of Goalhanger Podcasts. Copyright 2026. SHERLOCK AND CO. Based on the works of Sir Arthur Conan Doyle", "slug": "sherlock-co", "description_zh": "Goalhanger 出品的福尔摩斯现代改编有声剧。"}, {"rank": 27, "title": "The Saints", "author": "The Merry Beggars", "genre": "Drama", "rss": "https://www.omnyco esearch through cinematic human narration and atmospheric sound design. No AI stories or voices. Each episode explores speculative science, ethical dilemmas, and reality-altering phenomena as humanity attempts to understand and control the unknown. New episodes drop every Monday and Friday at 1pm EST. * * * CONTENT DISCLAIMER: This podcast contains explicit content not limited to intense themes, strong language, and depictions of violence intended for adults. Parental guidance is strongly advised for children under the age of 17. Listener discretion is advised. COPYRIGHT WARNING: The use of any affiliated audio of these episodes is not allowed, as it is a direct violation of copyright law and will result in legal action. LEGAL DISCLAIMER: Content related to the SCP Foundation, including this podcast, are licensed under Creative Commons Sharealike 3.0 Concepts. Copyright © 2021–2026 The SCP Experience. All rights reserved. #thescpexperience #scp #scpfoundation #scarystories #horrorstories #scpstories #scpexplained #whatisscp", "slug": "the-scp-experience", "description_zh": "SCP 基金会同人恐怖有声剧。"}, {"rank": 29, "title": "We're Alive", "author": "Wayland Productions Inc", "genre": "Drama", "rss": "https://feeds.acast.com/public/shows/d1b39068-c10f-5817-8324-88ba173183cd", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/88/38/f3/8838f306-076f-a82c-e438-d15ed81ad212/mza_4177118826207111524.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/were-alive/view", "description_en": "We're Alive is an award-winning audio drama that follows a group of Survivors in a post-apocalyptic Los Angeles now ruled by the \"Infected.\"It begins with “A Story of Survival” which spans from Chapters 1-48. Our survivors band together, fortify a safe haven known as the Tower, and discover that the Infected are far from the biggest threat they will have to face.The adventure continues with:“Lockdown” - A small group of inmates and prison guards are trapped in the T-block at Twin Towers Jail. They are forced to work together and find a way to escape while the rest of the world ends around them.“Goldrush” - Set 17 years after the main events of “A Story of Survival”, this is a recollection story that describes the efforts of the four Soldiers as they attempt a side mission to retrieve a suspected stash of gold bullion.\"Scout's Honor\" (on it's own feed!) - Adventure Scouts stranded on Catalina Island off the coast of California must use their wits and teamwork to survive during Outbreak.And “We’re Alive: Descendants,\" which follows the children of the Survivors as they navigate a dangerous new world.The story of survival continues; the fight is not over.18 years after the Outbreak, the world is starting to re-organize and rebuild, but many different forms of humanity are still struggling to survive in the aftermath. Nicholas Tink grew up in the shadow of his father. Little does he know that deep in the places where infected dwell, another descendant lies waiting. Content Warning: This podcast contains descriptions of graphic violence, sexual references, and strong language. Listener discretion is advised. Hosted on Acast. See acast.com/privacy for more information.", "slug": "were-alive", "description_zh": "僵尸末日题材有声剧播客。"}, {"rank": 30, "title": "The Harbingers", "author": "Audacious Machine Creative", "genre": "Fiction", "rss": "https://rss.art19.com/the-harbingers", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/c3/7d/d9/c37dd975-6703-01e6-e5d3-4c7d2f47c3ef/mza_1259745212478277748.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-harbingers/view", "description_en": "Adam Blackwell and Amy Stirling met as graduate students in anthropology, both obsessed with studying the same dead language and long-lost culture. Their relationship was always... complicated. They were bitter rivals, ideological opposites, and even went out on a date once - though they’d really prefer if everyone forgot about that last thing, thank you very much.Then, they became the first two people in thousands of years capable of doing magic.Over the next five years, they became global superstars, both revered and feared. Their powers led to a tragedy unlike any the world had seen before. Now, the world's first two magicians of the modern age must figure out the truth of their power, its consequences, and their relationship with one another before they do more damage to the world.The Harbingers is a new fiction podcast created by Gabriel Urbina, directed and sound designed by Jeffrey Nils Gardner.From Audacious Machine Creative.", "slug": "the-harbingers", "description_zh": "Audacious Machine 出品的恐怖类有声剧。"}], "Health & Fitness": [{"rank": 1, "title": "The Dylan Gemelli Podcast", "author": "Dylan Gemelli", "genre": "Alternative Health", "rss": "https://feed.podbean.com/dylangemelli/feed.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/65/4a/f4/654af4a7-d5cd-2317-91a1-b5913de83e6f/mza_12950421134232165951.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-dylan-gemelli-podcast/view", "description_en": "Welcome to The Dylan Gemelli Podcast! This Podcast is the ULTIMATE guide to enhancing your quality of life. Dylan is on a mission to bring the TRUTH to all of his listeners and subscribers on everything health and fitness related. Sit back, relax and be prepared to get educated on THE FACTS, without bias, on how to consistently fix and improve your quality of life, happiness and well being!! THE MISSION of this podcast is ensure that all listeners get the TRUTH and GUIDANCE necessary to overcome all adversities and to be inspired to take control of your lives! Dylan Gemelli is a prominent figure in the fitness and biohacking industry. He is known for his expertise in health, fitness, and performance enhancement. Dylan is the creator of the Dylan Gemelli Podcast, which features enlightening discussions with some of the most prominent experts and influencers in the health and wellness space, best selling authors, top cardiologists, neuroscientists and more!! His work focuses on improvi...", "slug": "the-dylan-gemelli-podcast", "description_zh": "Dylan Gemelli 主持的健康与生物黑客类播客。节目邀请心脏病专家、神经科学家、畅销书作家等各领域健康专家，探讨健身、长寿、激素疗法、肽类、营养代谢等话题，主打提供无偏见的健康真相。该节目目前位列苹果播客健康健身类排行榜首位。"}, {"rank": 2, "title": "Passion Struck with John R. Miles", "author": "Passion Struck with John R. Miles", "genre": "Alternative Health", "rss": "https://feeds.simplecast.com/XYHE1JPs", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/e8/d7/ca/e8d7ca5c-35fa-6e90-42ec-09e168d110cc/mza_400047353205660386.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-passion-struck-podcast/view", "description_en": "You built the life you were supposed to want. So why doesn't it feel like enough? Passion Struck is the #1 Health and Fitness podcast — and it exists to answer exactly that question. I'm John R. Miles — Navy veteran, former Fortune 50 executive, bestselling author — and I built this show because I lived the \"successful but empty\" version of life myself, and I wanted to find a better way. Each week, I sit down with the world's top voices in neuroscience, psychology, medicine, and elite performance — including Angela Duckworth, Susan Cain, Robert Waldinger, Daniel Amen, and Ryan Holiday — to unpack what the research tells us about purpose, connection, and resilience, and how to apply it to your own life. Fridays, I share what I'm learning directly, in solo episodes built around the same ideas. New interviews every Tuesday and Thursday. Solo episodes every Friday.", "slug": "the-passion-struck-podcast", "description_zh": "John R. Miles 主持的健康与自我提升类播客。节目围绕如何过上充实、有目标的人生展开，邀请各领域专家探讨心理学、神经科学、健康习惯等话题，帮助听众实现个人成长。"}, {"rank": 3, "title": "Tony Mantor: Why Not Me ?", "author": "iHeartPodcasts", "genre": "Mental Health", "rss": "https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/cd1d67c7-7e36-4004-a3dd-b47100fdf2e3/f88acc7d-0a9e-4ed7-b448-b47100fdf2f0/podcast.rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/47/e3/cc/47e3cc28-6d02-6d9f-8b6e-42d6d87e54a6/mza_3766587543936049722.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/tony-mantor-why-not-me-the-world/view", "description_en": "Autism, Mental Health, Advocacy & Human Stories.Embracing Autism/Mental Health Worldwide.Autism is a complex neurodevelopmental condition affecting millions worldwide, characterized by challenges in social interaction, communication, and repetitive behaviors. Despite increasing recognition, there remains a lack of understanding and awareness about the condition. Mental health encompasses a range of conditions impacting emotional, psychological, and social well-being, affecting millions globally. It includes disorders like anxiety, depression, bipolar disorder, schizophrenia, and psychosis. Schizophrenia is marked by symptoms such as hallucinations, delusions, and disorganized thinking, while psychosis involves a loss of contact with reality, often presenting with similar symptoms. Despite growing awareness, stigma and misconceptions about mental health, particularly schizophrenia and psychosis, persist, underscoring the need for greater understanding and support. From celebrating neurodiversity to breaking down stigma, we create a safe space for listeners to learn, grow, and feel seen. Whether you're on the spectrum, a caregiver, or an advocate, join our global community for inspiring conversations and empowering resources that uplift and unite. Tune in to embrace understanding, healing, and hope worldwide! Together, we can create a more informed and compassionate society for individuals with Autism and Mental Illness.", "slug": "tony-mantor-why-not-me-the-world", "description_zh": "iHeartPodcasts 出品，Tony Mantor 主持的心理健康类播客。节目融合幽默与个人经历，探讨自闭症倡导、心理健康与人生韧性，以积极向上的风格传递信息。"}, {"rank": 4, "title": "We're Out of Time", "author": "Richard Taite", "genre": "Mental Health", "rss": "https://anchor.fm/s/f5dbfa60/podcast/rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/69/75/90/697590b9-dcc7-91c1-a72a-4404c45f56f5/mza_16074264697810172157.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/we-re-out-of-time/view", "description_en": "This is home of the \"We're Out Of Time\" podcast where dives into the issues America can’t afford to ignore—from the fentanyl crisis and mental health to parenting, resilience, and hope. Hosted by addiction recovery expert Richard Taite, this podcast cuts through the noise with raw truth, real stories, and life-saving conversations. From former addicts and wellness experts to celebrities, athletes, musicians, and influencers, we ask the questions no one else will—educating, empowering, and demanding answers before it’s too late.", "slug": "we-re-out-of-time", "description_zh": "Richard Taite 主持的心理健康播客。"}, {"rank": 5, "title": "Huberman Lab", "author": "Scicomm Media", "genre": "Health & Fitness", "rss": "https://feeds.megaphone.fm/hubermanlab", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/9a/d3/19/9ad31912-0b5a-a16e-2d7c-9fd074698b9c/mza_8994222203629500925.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/huberman-lab/view", "description_en": "The Huberman Lab podcast is hosted by Andrew Huberman, Ph.D., a neuroscientist and tenured professor in the department of neurobiology, and by courtesy, psychiatry and behavioral sciences at Stanford School of Medicine. The podcast discusses neuroscience and science-based tools, including how our brain and its connections with the organs of our body control our perceptions, our behaviors, and our health, as well as existing and emerging tools for measuring and changing how our nervous system works. Huberman has made numerous significant contributions to the fields of brain development, brain function, and neural plasticity, which is the ability of our nervous system to rewire and learn new behaviors, skills, and cognitive functioning. He is a McKnight Foundation and Pew Foundation Fellow and was awarded the Cogan Award, given to the scientist making the most significant discoveries in the study of vision, in 2017.&nbsp; Work from the Huberman Laboratory at Stanford School of Medicine has been published in top journals, including Nature, Science, and Cell, and has been featured in TIME, BBC, Scientific American, Discover, and other top media outlets. In 2021, Dr. Huberman launched the Huberman Lab podcast. The podcast is frequently ranked in the top 10 of all podcasts globally and is often ranked #1 in the categories of Science, Education, and Health & Fitness.", "slug": "huberman-lab", "description_zh": "Andrew Huberman 博士主持的健康科学类播客，由 Scicomm Media 出品。节目基于神经科学与医学研究，深度讲解睡眠、压力、运动、荷尔蒙、认知能力等健康话题，邀请各领域科学家作为嘉宾，是健康科普类最有影响力的播客之一。"}, {"rank": 6, "title": "On Purpose with Jay Shetty", "author": "Perfect Strangers", "genre": "Mental Health", "rss": "https://feeds.megaphone.fm/on-purpose", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/ce/28/ed/ce28ed58-1943-22fe-c13c-a022c296bfd9/mza_9074901717975655208.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/on-purpose-with-jay-shetty/view", "description_en": "Jay Shetty hosts some of culture’s most influential voices in wellness and personal growth, helping you feel healthier, happier and more healed.", "slug": "on-purpose-with-jay-shetty", "description_zh": "Jay Shetty 主持的心理健康类播客，融合东方哲学与西方心理学，探讨人生意义、人际关系、心理成长，嘉宾多为知名人物与专家。"}, {"rank": 7, "title": "Nothing much happens: bedtime stories to help you sleep", "author": "Wellness Loud", "genre": "Health & Fitness", "rss": "https://feeds.megaphone.fm/SSM2868305742", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/87/f2/26/87f226c9-77ac-d4fe-6b98-4da2345de5c0/mza_5833691041544808336.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/nothing-much-happens-bedtime-stories-for-grown-ups/view", "description_en": "Can’t sle istening, early access to every series and live show tickets, a members-only newsletter, discounted books from the show, and access to our private Discord chatroom. Sign up directly at&nbsp;therestishistory.com. For more Goalhanger Podcasts, head to www.goalhanger.com.", "slug": "the-rest-is-history", "description_zh": "Goalhanger 出品，由前英国国会议员 Oded Eilon 与历史学家 Tom Holland 联合主持的历史类播客。节目每集一个历史主题，从古代到现代，风格风趣幽默，是英国最受欢迎的历史播客。"}, {"rank": 2, "title": "The Team House", "author": "dee takos", "genre": "History", "rss": "https://www.spreaker.com/show/5960890/episodes/feed", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/9c/de/05/9cde05f7-8b77-a0a7-f19b-37d29a9dd6bc/mza_15442820465629580994.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-team-house/view", "description_en": "The Team House is a long-form, fiercely apolitical national security podcast hosted by Jack Murphy, featuring special operations veterans, intelligence professionals, frontline reporters, and guests who have never spoken publicly before. It delivers deep-dive conversations on conflict, tradecraft, and the forces shaping the world, alongside the sister show Eyes On Geopolitics hosted by Mick Mulroy, Andy Milburn, and Jason Lyons, focused on breaking down current geopolitical events and what they mean for national security.Become a supporter of this podcast: https://www.spreaker.com/podcast/the-team-house--5960890/support.", "slug": "the-team-house", "description_zh": "dee takos 主持的历史类播客，聚焦二战与军事历史，访谈退伍军人与历史学家。"}, {"rank": 3, "title": "World War II with Tom Hanks", "author": "The HISTORY Channel | Back Pocket Studios | Audacy", "genre": "History", "rss": "https://rss.amperwave.net/v2/feed/audacynetwork/cc2b59fa44d0151fa8987e1b01e424bc", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/ca/de/71/cade7141-30ec-5437-99aa-4b43a10564f0/mza_7246282932912745813.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/world-war-ii-with-tom-hanks/view", "description_en": "For eighty years, the Second World War has remained the most devastating and defining conflict in human history. World War II with Tom Hanks reexamines the war through the lens of a new century. Told over twenty hours and guided by Tom Hanks, whose lifelong passion for this history has shaped some of the most profound screen portrayals of the era, the series captures the full arc of the war — from the rise of fascism in Europe to the fall of Berlin, from Pearl Harbor to Hiroshima, and the uneasy peace that follows. Each episode uncovers new dimensions of the conflict: the decisions that shaped the battlefield, the unseen networks that sustained the war effort, and the aftershocks that still shape our world today. World War II with Tom Hanks is the definitive retelling of that story for a new generation: a sweeping, deeply human portrait of how the modern world was forged in the fires of global war.", "slug": "world-war-ii-with-tom-hanks", "description_zh": "History Channel 出品，Tom Hanks 旁白的二战历史类播客，由 Audacy 发行。"}, {"rank": 4, "title": "The Ancients", "author": "History Hit", "genre": "History", "rss": "https://access.acast.com/rss/f2925f7a-eb08-471a-9958-387cb5ee6353", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts126/v4/6c/94/31/6c943113-5484-a41d-5cb7-bf606ff289ef/mza_6401313720037127611.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-ancients/view", "description_en": "<p>A podcast for all ancient history fans! The Ancients is dedicated to discussing our distant past. Featuring interviews with historians and archaeologists, each episode covers a specific theme from antiquity. From Neolithic Britain to the Fall of Rome. Hosted by Tristan Hughes.&nbsp;</p><br><p>New episodes every Sunday and Thursday.</p><br><p>From History Hit, the world's best history channel and creators of award-winning podcasts Dan Snow's History Hit, Gone Medieval, and Betwixt the Sheets.</p><br><p>History Hit is part of Little Dot Studios, a Certified B Corp™</p><br><p>Sign up to History Hit for hundreds of hours of original documentaries, with a new release every week and ad-free podcasts. Sign up at <a href=\"https://www.historyhit.com/subscribe\" rel=\"noopener noreferrer\" target=\"_blank\"><u>https://www.historyhit.com/subscribe</u></a>.&nbsp;&nbsp;</p> <hr><p style='color:grey; font-size:0.75em;'> Hosted on Acast. See <a style='color:grey;' target='_blank' rel='noopener noreferrer' href='https://acast.com/privacy'>acast.com/privacy</a> for more information.</p>", "slug": "the-ancients", "description_zh": "History Hit 出品的古代史类播客，聚焦古希腊、古罗马、古埃及等古代文明的历史与考古发现。"}, {"rank": 5, "title": "American Scandal", "author": "Audible", "genre": "History", "rss": "https://rss.art19.com/american-scandal", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/f7/91/9a/f7919a02-8948-7812-3c35-4c78ceea4815/mza_17740823854183495101.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/american-scandal/view", "description_en": "Every scandal begins with a lie. But the truth will come out. And then comes the fallout and the outrage.Scandals have shaped America since its founding. From business and politics to sports and society, we look on aghast as corruption, deceit and ambition bring down heroes and celebrities, politicians and moguls. And when the dust finally settles, we’re left to wonder: how did this happen? Where did they trip up, and who is to blame? From the creators of American History Tellers, Business Wars and Tides of History comes American Scandal, where we take you deep into the heart of America’s dark side to look at what drives someone to break the rules and what happens when they’re caught. Hosted by Lindsay Graham.Audible subscribers can listen to all episodes of American Scandal ad-free right now. Join Audible today by downloading the Audible app.", "slug": "american-scandal", "description_zh": "Audible 出品的历史类播客，每集讲述美国历史上的重大政治或商业丑闻，完整还原事件经过与背后的故事。"}, {"rank": 6, "title": "Plagues with Dr. Keith", "author": "Keith Sumey, MD", "genre": "History", "rss": "https://feeds.transistor.fm/plagues-with-dr-keith", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/62/91/11/62911178-10e1-6cc5-3978-ead8cc7a252a/mza_17581086774718916379.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/plagues-with-dr-keith/view", "description_en": "Exploring the science, history and sociology of the most significant diseases and pandemics throughout human history. Keith Sumey, MD will give insight, through the lens of an ER physician, of how disease impacts humanity.", "slug": "plagues-with-dr-keith", "description_zh": "Keith Sumey 医生主持的历史类播客，从医学视角讲述历史上的重大瘟疫与传染病。"}, {"rank": 7, "title": "Lore", "author": "Aaron Mahnke", "genre": "History", "rss": "https://rss.libsyn.com/shows/65267/destinations/259905.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts126/v4/9b/e0/c0/9be0c09c-b803-4774-77d3-85167bc87a31/mza_16743750170316675841.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/lore/view", "description_en": "The award-winning podcast (also a TV show & book series) about dark historical tales. Each episode explores the mysterious creatures, tragic events, and unusual places that fill the pages of history. Because sometimes the truth is more frightening than fiction.", "slug": "lore", "description_zh": "Aaron Mahnke 主持的历史类播客，每集讲述一个与历史传说、民间故事相关的真实事件，融合历史与恐怖元素，氛围神秘。"}, {"rank": 8, "title": "History's Greatest Mysteries", "author": "The HISTORY Channel | Rewind Studios", "genre": "History", "rss": "https://rss.art19.com/historys-greatest-mysteries", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/12/6f/c8/126fc8cc-1af0-a80b-a285-ec876388aa98/mza_2490395106914128943.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/history-s-greatest-mysteries/view", "description_en": "A History Channel original podcast brought to you by Rewind Studios, History's Greatest Mysteries examines the top theories surrounding the world's most enigmatic unsolved mysteries. Each episode unpacks these puzzles with contributions from top historians, authors, scientists, and researchers. From unsolved crimes to lost and buried treasures, and the deaths and disappearances of famous figures, History's Greatest Mysteries explores possible explanations to some of the world's most confounding events.History’s Greatest Mysteries is a History Channel original podcast brought to you by Rewind Studios. New episodes every Wednesday. Follow wherever you get your podcasts.", "slug": "history-s-greatest-mysteries", "description_zh": "历史悬疑类播客。"}, {"rank": 9, "title": "American History Tellers", "author": "Audible", "genre": "History", "rss": "https://rss.art19.com/american-history-tellers", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/93/37/d8/9337d89a-95d3-8df3-c08a-15408017e408/mza_18105168834619059515.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/american-history-tellers/view", "description_en": "The Cold War, Prohibition, the Gold Rush, the Space Race. Every part of your life - the words you speak, the ideas you share - can be traced to our history, but how well do you really know the stories that made America? We'll take you to the events, the times and the people that shaped our nation. And we'll show you how our history affected them, their families and affects you today. Hosted by Lindsay Graham (not the Senator). From Wondery, the network behind American Scandal, Tides of History, American Innovations and more.Audible subscribers can listen to all episodes of American History Tellers ad-free right now. Join Audible today by downloading the Audible app.", "slug": "american-history-tellers", "description_zh": "Audible 出品的历史类播客，每集一个历史时期或事件，由多位旁白者共同演绎，像历史纪录片一样讲述美国历史。"}, {"rank": 10, "title": "Throughline", "author": "NPR", "genre": "History", "rss": "https://feeds.npr.org/510333/podcast.xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/da/c1/8e/dac18e58-b4c2-525a-2322-b4ec96ee5008/mza_3318470252564262999.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/throughline/view", "description_en": "Throughline is a time machine. Each episode, we travel beyond the headlines to answer the question, \"How did we get here?\" We use sound and stories to bring history to life and put you into the middle of it. From ancient civilizations to forgotten figures, we take you directly to the moments that shaped our world. Throughline is hosted by Peabody Award-winning journalist Rund Abdelfatah. Support public media by joining NPR+ at plus.npr.org. You’ll get perks for over 25 NPR podcasts, including sponsor-free listening for Throughline.", "slug": "throughline", "description_zh": "NPR 出品的历史类播客，由 Rund Abdelfatah 与 Ramtin Arablouei 主持，追溯当下重要事件与议题的历史根源，把历史与现实联系起来。"}, {"rank": 11, "title": "History That Doesn't Suck", "author": "Prof. Greg Jackson", "genre": "History", "rss": "https://rss.amperwave.net/v2/feed/audacynetwork/e69da14a26973f1dc761432876205254", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/73/50/1f/73501fd7-de66-cdfe-d316-334eae92b855/mza_17847109988024788034.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/history-that-doesnt-suck/view", "description_en": "HTDS is a bi-weekly podcast, delivering a legit, seriously researched, hard-hitting survey of American history through entertaining stories. To keep up with History That Doesn’t Suck news, check us out htdspodcast.com or follow on Facebook and Instagram: @historythatdoesntsuck. Become a premium member to support our work, receive ad-free episodes and bonus episodes.Pre-order Prof. Jackson's new book Been There Done That: How Our History Shows What We Can Overcome", "slug": "history-that-doesnt-suck", "description_zh": "Greg Jackson 教授主持的历史类播客，用风趣幽默的方式讲述美国与世界历史，每集一个历史时期，风格轻松不枯燥。"}, {"rank": 12, "title": "Sleepy History", "author": "Slumber Studios", "genre": "History", "rss": "https://feeds.megaphone.fm/sleepyhistory", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/09/40/e9/0940e9b3-42ff-bdc2-807b-cdd888503f75/mza_10975884687951750557.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/sleepy-history/view", "description_en": "Explore history's most intriguing stories, people, places, events, and mysteries, delivered in a supremely calming atmosphere. If you struggle to fall asleep and you have a curious mind, Sleepy History is the perfect bedtime companion. Our stories will gently grasp your attention, pulling your mind away from any racing thoughts, making room for the soothing music and calming narration to guide you into a peaceful sleep.&nbsp; Sleepy History is a production of Slumber Studios. To learn more, visit www.slumberstudios.com.", "slug": "sleepy-history", "description_zh": "Slumber Studios 出品的助眠历史类播客，用缓慢的语调讲述历史故事，帮助入睡。"}, {"rank": 13, "title": "Dan Carlin's Hardcore History", "author": "Dan Carlin", "genre": "History", "rss": "https://feeds.feedburner.com/dancarlin/history?format=xml", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts115/v4/49/b7/eb/49b7eb32-8f08-6fac-aadb-2f002131fe5f/mza_15196161972010256532.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/dan-carlins-hardcore-history/view", "description_en": "In \"Hardcore History\" journalist and broadcaster Dan Carlin takes his \"Martian\", unorthodox way of thinking and applies it to the past. Was Alexander the Great as bad a person as Adolf Hitler? What would Apaches with modern weapons be like? Will our modern civilization ever fall like civilizations from past eras? This isn't academic history (and Carlin isn't a historian) but the podcast's unique blend of high drama, masterful narration and Twilight Zone-style twists has entertained millions of listeners.", "slug": "dan-carlins-hardcore-history", "description_zh": "Dan Carlin 独立制作的历史类播客，每集时长 3-5 小时，深度剖析一个历史事件或时代，叙事宏大、细节丰富，是长篇历史播客的标杆。"}, {"rank": 14, "title": "Stuff You Missed in t about dates and textbooks – it’s about extraordinary characters, amazing stories, and some very questionable fashion choices. How long did it take to build an Egyptian pyramid? What does the Bayeux Tapestry reveal about medieval life? Why did it take nearly half a millennium for Joan of Arc to become a saint? And was Catherine the Great really all that great? Whether you want to explore ancient landmarks like Stonehenge and Machu Picchu, dance through the history of Broadway and Bollywood, or find out how the Tudors rose to power, Greg and his guests promise to teach you something new that you won’t have heard in history lessons.Previous episodes of You’re Dead To Me have covered everything from royals to revolutionaries, actors to activists and divas to dictators. Take a stroll through the history of high-heeled shoes or get the scoop on the history of ice cream. Maybe you’d like to paint like the cave artists of the Palaeolithic era, work out like a Victorian bodybuilder, or fight like a Spartan? We’ve even hosted a special, live episode with the BBC Concert Orchestra to explore the dramatic life of Wolfgang Amadeus Mozart.Whatever your historical interests, Greg and his guests make even the trickiest topics easy to follow. Join them for a history lesson that’s as entertaining as it is enlightening - with no homework required.", "slug": "youre-dead-to-me", "description_zh": "BBC Radio 4 出品的喜剧历史类播客，由喜剧演员与历史学家联合主持。"}, {"rank": 17, "title": "American History Hit", "author": "History Hit", "genre": "History", "rss": "https://access.acast.com/rss/62c7fb2a7acf3900129dffa7", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts122/v4/27/22/e5/2722e5a8-4e84-0930-3035-c61a608e640a/mza_14402837744013083305.jpeg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/american-history-hit/view", "description_en": "<p><strong>Join Don Wildman twice a week for your hit of American history, as he explores the past to help us understand the United States of today.</strong></p><p>&nbsp;</p><p>We’ll hear how codebreakers uncovered secret Japanese plans for the Battle of Midway, visit Chief Powhatan as he prepares for war with the British, see Walt Disney accuse his former colleagues of being communists, and uncover the dark history that lies beneath Central Park.&nbsp;&nbsp;</p><p>&nbsp;</p><p>From pre-colonial America to independence, slavery to civil rights, the gold rush to the space race, join Don as he speaks to leading experts to delve into America’s past.</p><p>&nbsp;</p><p>New episodes every Monday and Thursday.</p><p>&nbsp;</p><p>Brought to you by History Hit, the award-winning podcast network and world’s best history channel on demand, featuring shows like Dan Snow’s History Hit, Not Just The Tudors and Betwixt the Sheets.</p><br><p>History Hit is part of Little Dot Studios, a Certified B Corp™</p><br><p>Sign up to History Hit for hundreds of hours of original documentaries, with a new release every week and ad-free podcasts. Sign up at <a href=\"https://www.historyhit.com/subscribe\" rel=\"noopener noreferrer\" target=\"_blank\"><u>https://www.historyhit.com/subscribe</u></a>.&nbsp;&nbsp;</p> <hr><p style='color:grey; font-size:0.75em;'> Hosted on Acast. See <a style='color:grey;' target='_blank' rel='noopener noreferrer' href='https://acast.com/privacy'>acast.com/privacy</a> for more information.</p>", "slug": "american-history-hit", "description_zh": "History Hit 出品的美国历史类播客。"}, {"rank": 18, "title": "Everything Everywhere Daily: History, Science, Geography & More", "author": "Gary Arndt", "genre": "History", "rss": "https://feeds.megaphone.fm/ADV3162807280", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts221/v4/86/4d/63/864d633a-c967-63c5-1049-cd4ee58cc25f/mza_13853411904170903695.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/everythingeverywhere/view", "description_en": "Everything Everywhere Daily is a daily podcast that explores a wide range of topics in history, science, geography, and culture, delivering concise, engaging explanations designed to make complex subjects accessible and interesting to a broad audience. Every day, Everything Everywhere Daily explores fascinating subjects from world history, geography, science, culture, and current events, giving you clear, concise explanations designed to help you learn something new in just minutes. Whether it’s the rise and fall of empires, the mysteries of ancient civilizations, the stories behind famous people, or the science that shapes our world, each episode breaks down complex ideas into accessible, entertaining insights. This educational podcast covers a wide range of topics, including world history, historical events, geography, countries of the world, science and technology, space exploration, economics, politics, and cultural traditions. Episodes dive into everything from the Roman Empire, World War II, and the Age of Exploration to black holes, quantum physics, climate science, and global trade. If you enjoy learning about how the world works and why history matters, this podcast is designed for you. Perfect for curious minds, students, lifelong learners, and fans of educational content, Everything Everywhere Daily delivers daily knowledge in an easy-to-understand, fun-to-listen-to format. Each episode is carefully researched and crafted to provide accurate, reliable information while keeping the storytelling engaging and memorable. If you’re interested in history podcasts, science podcasts, geography podcasts, educational podcasts, or daily learning content, Everything Everywhere Daily brings it all together in one place. With thousands of episodes available, you can explore topics like ancient history, modern geopolitics, scientific discoveries, famous biographies, and little-known facts from around the globe. Subscribe today to Everything Everywhere Daily and join millions of listeners who are learning something new every day.", "slug": "everythingeverywhere", "description_zh": "Gary ied", "author": "Goalhanger", "genre": "History", "rss": "https://feeds.megaphone.fm/therestisclassified", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/f4/09/a7/f409a749-1c83-ddb6-26ca-3edb6deee0f9/mza_6566356699697291626.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/the-rest-is-classified/view", "description_en": "Enter the secretive world of spies, espionage, and covert operations.&nbsp; Hosted by former CIA analyst turned spy novelist, David McCloskey, and veteran security correspondent, Gordon Corera, this podcast unravels real-life spy stories, intelligence secrets, and the hidden power struggles shaping global events.&nbsp; From Cold War espionage to modern-day intelligence agencies like the CIA, MI6, and Mossad, explore the world of double agents, classified missions, and the shadowy figures who operate in them. Whether you're a true crime addict, a thriller fan, or fascinated by spy stories, this is the show for you.", "slug": "the-rest-is-classified", "description_zh": "Goalhanger 出品的情报与间谍历史类播客。"}, {"rank": 24, "title": "In Our Time", "author": "BBC Radio 4", "genre": "History", "rss": "https://podcasts.files.bbci.co.uk/b006qykl.rss", "thumbnail": "https://is1-ssl.mzstatic.com/image/thumb/Podcasts211/v4/f3/12/e7/f312e703-b626-0091-5bdf-73d79cce25c5/mza_16900938594910783199.jpg/600x600bb.jpg", "podfollow_url": "https://podfollow.com/in-our-time/view", "description_en": "A world-class seminar, every week. In Our Time explores the ideas, people and discoveries that have shaped our world, spanning history, philosophy, religion, science, literature, art and culture. On Thursdays, hear brand-new episodes hosted by Misha Glenny and leading academics. On Mondays, discover Misha's Archive Picks: classic conversations from the In Our Time archive, originally presented by Melvyn Bragg. Recent episodes have featured topics as wide-ranging as the Roman Arena, Handel's Messiah, John Keats, On Liberty and the Mariana Trench, bringing
